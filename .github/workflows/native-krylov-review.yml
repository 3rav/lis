name: Native restarted eigensolver integration validation

on:
  push:
    branches:
      - ci/native-krylov-review-validation-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  serial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin pkg-config gfortran
      - name: Regenerate configure files
        run: autoreconf -fiv
      - name: Configure and build LIS
        run: |
          mkdir build
          cd build
          ../configure
          make -j2
      - name: Run native Krylov tests and LIS API integration
        run: |
          cd build
          make -C test test_krylov_modes test_krylov_sparse test_krylov_regression test_krylov_lis
          ./test/test_krylov_modes
          ./test/test_krylov_sparse
          ./test/test_krylov_regression
          ./test/test_krylov_lis
      - name: Check test registration
        run: |
          cd build
          make -C test check TESTS="test_krylov_modes test_krylov_sparse test_krylov_regression test_krylov_lis"
      - name: Standalone UBSan
        run: |
          cc -O1 -g -std=c99 -Wall -Wextra -Werror -fsanitize=undefined \
            -Iinclude src/esolver/lis_krylov.c test/test_krylov_modes.c -lm -o /tmp/krylov_modes_ubsan
          /tmp/krylov_modes_ubsan
          cc -O1 -g -std=c99 -Wall -Wextra -Werror -fsanitize=undefined \
            -Iinclude src/esolver/lis_krylov.c test/test_krylov_regression.c -lm -o /tmp/krylov_regression_ubsan
          /tmp/krylov_regression_ubsan
  omp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin pkg-config gfortran
      - name: Regenerate configure files
        run: autoreconf -fiv
      - name: Build with OpenMP
        run: |
          mkdir build-omp
          cd build-omp
          ../configure --enable-omp
          make -j2
          make -C test test_krylov_lis test_krylov_regression
          OMP_NUM_THREADS=2 ./test/test_krylov_lis
          OMP_NUM_THREADS=2 ./test/test_krylov_regression
