name: Baseline GCC LTO Fortran on pristine upstream
on:
  push:
    branches: [validation/fortran-lto-upstream-baseline-20261031]
  workflow_dispatch:
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin gfortran
      - name: Reproduce upstream LTO mismatch
        run: |
          set -o pipefail
          autoreconf -fiv
          mkdir build && cd build
          CFLAGS="-O1 -g -flto -Werror=lto-type-mismatch" \
          FFLAGS="-O1 -g -flto -Werror=lto-type-mismatch" \
          FCFLAGS="-O1 -g -flto -Werror=lto-type-mismatch" \
          LDFLAGS="-flto -Werror=lto-type-mismatch" \
          ../configure --enable-fortran
          if make -j2 > lto-baseline.log 2>&1; then
            echo "Unexpected: unmodified upstream builds successfully"
            exit 1
          fi
          grep -E "(lis_set_argv_f|lto-type-mismatch|type mismatch in parameter 4)" lto-baseline.log | tail -25
          grep -q "lto-type-mismatch" lto-baseline.log
      - name: Save baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-upstream-lto-error
          path: build/lto-baseline.log
          if-no-files-found: ignore
