name: RCI native real extended scalar qualification
on:
  push:
    branches: ['qualification/rci-native-real-extended-20261127']
permissions:
  contents: read
jobs:
  extended:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scalar: [extended, binary128]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: bash
        run: |
          set -euo pipefail
          # Krylov has a separate fixed double ABI.
          for n in linear gcro fgcro feast; do python3 "qualification/rci-restore/qualify_${n}_native.py"; done
          opts=(--disable-rci --enable-shared --disable-mpi --disable-quad --disable-fortran --disable-f90 --disable-saamg --disable-omp --enable-longdouble)
          if [ "${{ matrix.scalar }}" = extended ]; then export ac_cv_header_quadmath_h=no; fi
          ./configure "${opts[@]}"
          grep -q '^#define _LONG__DOUBLE 1' include/lis_config.h
          if [ "${{ matrix.scalar }}" = extended ]; then ! grep -q '^#define HAVE_QUADMATH_H 1' include/lis_config.h; else grep -q '^#define HAVE_QUADMATH_H 1' include/lis_config.h; fi
          make -C src -j2
          export OMP_NUM_THREADS=1
          for t in linear_precision gcro_native fgcro_native feast_native; do
            cc -std=gnu11 -DHAVE_CONFIG_H -O2 -Iinclude -Iqualification/rci-restore/ "qualification/rci-restore/test_$t.c" -Lsrc/.libs -Wl,-rpath,"$PWD/src/.libs" -llis -lm -lquadmath -o "$RUNNER_TEMP/$t"
            "$RUNNER_TEMP/$t"
            echo "REAL EXTENDED DIFFERENTIAL PASS $t"
          done
