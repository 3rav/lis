name: Serial ILUT vs parallel local-RCM RAS at measured fill

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/ras-schur-scalable
    paths:
      - .github/workflows/ras-serial-reference.yml
      - test/testhalfilut.c

permissions:
  contents: read

jobs:
  serial-ilut-reference:
    name: One-thread ILUT vs eight-domain RAS on public bcsstk39
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '8'
      OMP_DYNAMIC: 'FALSE'
      LIS_FEA_BASELINE_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin unzip
      - name: Build LIS with OpenMP support
        run: |
          autoreconf -fiv
          ./configure --enable-test --enable-omp --disable-fortran --disable-f90 \
            --disable-saamg --disable-mpi
          make -j2
          make -C test testhalfilut
      - name: Fetch fixed public structural stiffness example
        run: |
          set -euo pipefail
          mkdir -p serial-reference
          curl --fail --location --retry 3 --max-time 180 \
            https://nrvis.com/download/data/misc/bcsstk39.zip \
            -o serial-reference/bcsstk39.zip
          unzip -o -q serial-reference/bcsstk39.zip -d serial-reference
          find serial-reference -type f -iname '*.mtx' -exec chmod u+r {} +
          mtx="$(find serial-reference -type f -iname '*.mtx' | head -1)"
          test -n "$mtx"
          grep -qiE '^%%MatrixMarket matrix coordinate real' <(head -n 1 "$mtx")
          echo "$mtx" > serial-reference/matrix.txt
      - name: Compare serial ILUT vs parallel RAS (raw or RCM ordered serial baseline)
        run: |
          set -uo pipefail
          set +e
          mtx="$(cat serial-reference/matrix.txt)"
          for baseline_rcm in 0 1; do
            export LIS_FEA_BASELINE_RCM="$baseline_rcm"
            log="serial-reference/baseline-rcm-${baseline_rcm}.log"
            echo "### serial ILUT RCM=$baseline_rcm | RAS local RCM=1; overlap=1" | tee "$log"
            # Rates are intentionally only the first PROBE. Never claim
            # 5%-matched fill until actual stored counts prove it.
            timeout 600 ./test/testhalfilut --fea-ras \
              "$mtx" 8 8 8 0.005 8 1 0 1 0 1 \
              > "$log" 2>&1
            status=$?
            cat "$log"
            echo "$status" > "serial-reference/exit-${baseline_rcm}.txt"
            echo "benchmark_exit_status=$status"
          done
          set -e
          for baseline_rcm in 0 1; do
            log="serial-reference/baseline-rcm-${baseline_rcm}.log"
            grep -q '^FEA_RAS_MATRIX ' "$log"
            grep -q '^baseline,' "$log"
            grep -q '^ras,' "$log"
            grep -q '^ras_schur,' "$log"
          done
      - name: Upload full benchmark results even if not converged
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bcsstk39-serial-ILUT-vs-RAS
          path: |
            serial-reference/baseline-rcm-*.log
            serial-reference/exit-*.txt
            serial-reference/matrix.txt
          if-no-files-found: warn
