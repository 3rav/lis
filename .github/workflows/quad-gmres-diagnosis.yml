name: Diagnose switched GMRES quad complex
on:
  push:
    branches: [validation/quad-complex-gmres-diagnosis-20261031]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: real, opts: ""}
          - {mode: complex, opts: "--enable-complex"}
    env:
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin gfortran
      - name: Build quad
        run: |
          autoreconf -fiv
          mkdir build && cd build
          CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" LDFLAGS="-fsanitize=address,undefined" ../configure --enable-quad ${{ matrix.opts }}
          grep -Eq '^#define USE_QUAD_PRECISION 1' include/lis_config.h
          make -j2
      - name: Run diagnostic (nonzero is expected for upstream)
        run: |
          cd build
          timeout 3m ./test/testsolvercallbackpaths 2>&1 | tee quad-diagnosis.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quad-diagnosis-${{ matrix.mode }}
          path: build/quad-diagnosis.log
