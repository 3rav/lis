name: RCI RC3 consolidated qualification
on:
  push:
    branches: ['qualification/rci-rc3-consolidated-20261127']
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: serial, index: int32, sanitize: 'no'}
          - {mode: openmp, index: int64, sanitize: 'no'}
          - {mode: serial, index: int64, sanitize: 'yes'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: bash
        run: |
          set -euo pipefail
          python3 qualification/rci-restore/qualify_full_native.py
          opts=(--enable-rci --enable-test --enable-shared --disable-mpi --disable-quad --disable-fortran --disable-f90 --disable-saamg)
          flags=(-std=gnu11 -DHAVE_CONFIG_H -O2)
          if [ "${{ matrix.mode }}" = openmp ]; then opts+=(--enable-omp); flags+=(-fopenmp); else opts+=(--disable-omp); fi
          if [ "${{ matrix.index }}" = int64 ]; then opts+=(--enable-longlong); flags+=(-D_LONG__LONG); fi
          if [ "${{ matrix.sanitize }}" = yes ]; then
            export CFLAGS='-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer'
            export LDFLAGS='-fsanitize=address,undefined'
            flags+=(-g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -no-pie)
          fi
          ./configure "${opts[@]}"
          make -C src -j2
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1
          tests=(full_native native_session linear_native gcro_native fgcro_native krylov_restore feast_native)
          for t in "${tests[@]}"; do
            cc "${flags[@]}" -DLIS_RCI_KRYLOV_NATIVE_LIBRARY -Iinclude -Iqualification/rci-restore/ "qualification/rci-restore/test_$t.c" -Lsrc/.libs -Wl,-rpath,"$PWD/src/.libs" -llis -lm -o "$RUNNER_TEMP/$t"
            ldd "$RUNNER_TEMP/$t" | grep -F "$PWD/src/.libs/liblis.so"
            OMP_NUM_THREADS=1 "$RUNNER_TEMP/$t"
            if [ "${{ matrix.mode }}" = openmp ]; then OMP_NUM_THREADS=4 "$RUNNER_TEMP/$t"; fi
            echo "ALL NATIVE DIFFERENTIAL PASS $t"
          done
          if [ "${{ matrix.sanitize }}" = no ]; then
            export OMP_NUM_THREADS=1
            if [ "${{ matrix.mode }}" = openmp ]; then export OMP_NUM_THREADS=4; fi
            if ! make -C test -j2 check; then cat test/test-suite.log; exit 1; fi
            cat test/test-suite.log
          fi
          echo 'ALL EIGHT NATIVE CORE INTEGRATION PASS'
  precision:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scalar: [complex, extended, binary128, complex-extended, complex-binary128]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: bash
        run: |
          set -euo pipefail
          opts=(--disable-rci --enable-shared --disable-mpi --disable-quad --disable-fortran --disable-f90 --disable-saamg --disable-omp)
          case "${{ matrix.scalar }}" in
            complex) opts+=(--enable-complex);;
            extended) opts+=(--enable-longdouble); export ac_cv_header_quadmath_h=no;;
            binary128) opts+=(--enable-longdouble);;
            complex-extended) opts+=(--enable-complex --enable-longdouble); export ac_cv_header_quadmath_h=no;;
            complex-binary128) opts+=(--enable-complex --enable-longdouble);;
          esac
          ./configure "${opts[@]}"
          grep -E '^(#define|/\* #undef) (_LONG__DOUBLE|_COMPLEX|HAVE_QUADMATH_H)' include/lis_config.h
          if [[ "${{ matrix.scalar }}" == complex* ]]; then grep -q '^#define _COMPLEX 1' include/lis_config.h; export LIS_RCI_QUAL_COMPLEX=1; fi
          case "${{ matrix.scalar }}" in
            *extended) grep -q '^#define _LONG__DOUBLE 1' include/lis_config.h; ! grep -q '^#define HAVE_QUADMATH_H 1' include/lis_config.h;;
            *binary128) grep -q '^#define _LONG__DOUBLE 1' include/lis_config.h; grep -q '^#define HAVE_QUADMATH_H 1' include/lis_config.h;;
          esac
          python3 qualification/rci-restore/qualify_all_native.py
          make -C src -j2
          for t in linear_precision feast_native; do
            cc -std=gnu11 -DHAVE_CONFIG_H -O2 -Iinclude -Iqualification/rci-restore/ "qualification/rci-restore/test_$t.c" -Lsrc/.libs -Wl,-rpath,"$PWD/src/.libs" -llis -lm -lquadmath -o "$RUNNER_TEMP/$t"
            ldd "$RUNNER_TEMP/$t" | grep -F "$PWD/src/.libs/liblis.so"
            OMP_NUM_THREADS=1 "$RUNNER_TEMP/$t"
          done
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: serial, index: int32, threads: 1}
          - {mode: openmp, index: int64, threads: 4}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: bash
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS=${{ matrix.threads }} OMP_DYNAMIC=FALSE
          opts=(--enable-rci --enable-shared --disable-mpi --disable-quad --disable-fortran --disable-f90 --disable-saamg)
          flags=(-std=gnu11 -DHAVE_CONFIG_H -O2)
          if [ "${{ matrix.mode }}" = openmp ]; then opts+=(--enable-omp --enable-longlong); flags+=(-fopenmp -D_LONG__LONG); else opts+=(--disable-omp); fi
          ./configure "${opts[@]}"
          make -C src -j2
          mkdir "$RUNNER_TEMP/base"
          cp -a src/.libs/liblis.so* "$RUNNER_TEMP/base/"
          cc "${flags[@]}" -Iinclude qualification/rci-restore/benchmark_native_public.c -L"$RUNNER_TEMP/base" -llis -lm -o "$RUNNER_TEMP/old-client"
          nm -D --defined-only src/.libs/liblis.so | awk '{print $2,$3}' | LC_ALL=C sort -u > "$RUNNER_TEMP/base.symbols"
          make -C src clean
          python3 qualification/rci-restore/qualify_all_native.py
          make -C src -j2
          nm -D --defined-only src/.libs/liblis.so | awk '{print $2,$3}' | LC_ALL=C sort -u > "$RUNNER_TEMP/new.symbols"
          comm -23 "$RUNNER_TEMP/base.symbols" "$RUNNER_TEMP/new.symbols" > "$RUNNER_TEMP/missing"
          cat "$RUNNER_TEMP/missing"; test ! -s "$RUNNER_TEMP/missing"
          python3 qualification/rci-restore/benchmark_native_public.py "$RUNNER_TEMP/old-client" "$RUNNER_TEMP/base" "$PWD/src/.libs" "$RUNNER_TEMP/report.json"
          cat "$RUNNER_TEMP/report.json"
