name: Reproduce quad vector unset/reuse work leak on upstream
on:
  push:
    branches: [validation/quad-unset-work-baseline-20261031]
  workflow_dispatch:
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin gfortran
      - name: Build pristine upstream quad with new test only
        run: |
          autoreconf -fiv
          mkdir build && cd build
          ../configure --enable-quad
          make -j2
      - name: Confirm stale quad work allocation on upstream
        run: |
          cd build
          if ./test/testvectorreal64 > baseline.log 2>&1; then
            cat baseline.log
            echo "Unexpected pass"
            exit 1
          fi
          cat baseline.log
          grep -q "QUAD_VECTOR_UNSET_REUSE=FAIL" baseline.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quad-unset-original-failure
          path: build/baseline.log
          if-no-files-found: ignore
