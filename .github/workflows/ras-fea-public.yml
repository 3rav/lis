name: Experimental public structural-FEA RAS benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/ras-schur-scalable
    paths:
      - .github/workflows/ras-fea-public.yml

permissions:
  contents: read

jobs:
  bcsstk39-structural:
    name: Public Boeing bcsstk39 structural stiffness (not contact KKT)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin unzip
      - name: Build current LIS RAS/Schur experiment
        run: |
          autoreconf -fiv
          ./configure --enable-test --enable-omp --disable-fortran --disable-f90 \
            --disable-saamg --disable-mpi
          make -j2
          make -C test testhalfilut
      - name: Fetch public 3D finite-element stiffness example
        run: |
          set -euo pipefail
          mkdir -p public-fea
          # This independent public mirror is used because the SuiteSparse
          # collection reported file-download outages in November 2026.
          # Fetch only once per workflow, and never label it contact KKT.
          curl --fail --location --retry 3 --max-time 180 \
            "https://nrvis.com/download/data/misc/bcsstk39.zip" \
            -o public-fea/bcsstk39.zip
          unzip -o -q public-fea/bcsstk39.zip -d public-fea
          # The Network Repository ZIP preserves non-readable UNIX modes.
          find public-fea -type f -name '*.mtx' -exec chmod u+r {} +
          matrix="$(find public-fea -type f -iname '*.mtx' | head -1)"
          test -n "$matrix" || { echo "::error::No Matrix Market matrix"; exit 1; }
          head -n 1 "$matrix" | tee public-fea/header.txt
          if ! grep -qiE '^%%MatrixMarket matrix coordinate real' public-fea/header.txt; then
            echo "::error::Source must preserve real-valued stiffness coefficients, not only graph pattern"
            exit 1
          fi
          printf '%s\n' "$matrix" > public-fea/matrix-path.txt
      - name: Baseline ILUT vs RAS vs RAS+Schur (4 and 8 OpenMP threads)
        run: |
          set -uo pipefail
          set +e
          matrix="$(cat public-fea/matrix-path.txt)"
          for nth in 4 8; do
            export OMP_NUM_THREADS="$nth"
            export OMP_DYNAMIC=FALSE
            for row_scale in 0 1; do
              log="public-fea/bench-${nth}-scale-${row_scale}.log"
              echo "### nthreads=$nth row_scale=$row_scale" | tee "$log"
              # Exploratory cases may fail to converge. Continue with all
              # four configurations and preserve their exact exit statuses.
              timeout 600 ./test/testhalfilut --fea-ras \
                "$matrix" 8 8 8 0.005 8 1 1 1 "$row_scale" \
                2>&1 | tee -a "$log"
              status="${PIPESTATUS[0]}"
              printf '%s\n' "$status" > "public-fea/status-${nth}-scale-${row_scale}.txt"
              echo "benchmark_exit_status=$status" | tee -a "$log"
            done
          done
          # Do not claim a speedup: consult residual, fill proxy, status,
          # setup+solve wall time, and eventual peak-RSS measurements.
      - name: Publish reproducibility logs and input metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-bcsstk39-ras-results
          path: |
            public-fea/bench-*.log
            public-fea/status-*.txt
            public-fea/header.txt
            public-fea/matrix-path.txt
          if-no-files-found: warn
