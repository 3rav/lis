name: USER serial combined validation
on:
  pull_request:
    paths:
      - '.github/workflows/user-serial-combined.yml'
  push:
    branches: ['integration/user-serial-20261125']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  serial:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [release, asan-ubsan]
        index: [int32, int64]
        scalar: [real, complex]
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Build and validate USER without MPI
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          if [ "${{ matrix.mode }}" = asan-ubsan ]; then
            export CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
            export LDFLAGS="-fsanitize=address,undefined"
          else
            export CFLAGS="-O2 -g"
            export LDFLAGS=""
          fi
          index_flags=""
          scalar_flags="--disable-complex"
          if [ "${{ matrix.index }}" = int64 ]; then
            index_flags="--enable-longlong"
          fi
          if [ "${{ matrix.scalar }}" = complex ]; then
            scalar_flags="--enable-complex"
          fi
          ./configure --enable-test --enable-oom-tests --enable-omp --disable-mpi --disable-fortran --disable-f90 --disable-saamg ${index_flags} ${scalar_flags}
          make -C src -j2
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          if [ "${{ matrix.scalar }}" = complex ]; then
            make -C test testusercomplexadjoint
            OMP_NUM_THREADS=1 timeout 120s ./test/testusercomplexadjoint
            OMP_NUM_THREADS=4 timeout 120s ./test/testusercomplexadjoint
          else
            make -C test testbicgstablinit testuserbicgstabl testusercrcomplex testusercrserrors testuserfgcrodrerrors testusergmreserrors testusergpbic testuseridrcallback testuserorthominerrors testusertfqmrcallback testusereigenpower testusereigeninverse testusereigencgcr testusereigenprojection testusereigenrqiguard testusereigenstatus testusergcrodrerrors testuserrowoom
            for t in testbicgstablinit testuserbicgstabl testusercrcomplex testusercrserrors testuserfgcrodrerrors testusergmreserrors testusergpbic testuseridrcallback testuserorthominerrors testusertfqmrcallback testusereigenpower testusereigeninverse testusereigencgcr testusereigenprojection testusereigenrqiguard testusereigenstatus testusergcrodrerrors testuserrowoom; do
              timeout 120s ./test/$t
            done
          fi
