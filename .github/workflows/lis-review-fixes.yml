name: Review fixes PR168
on:
  push:
    branches: [validation/pr168-review-fixes-20261101]
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: real-i4, opts: "", cflags: "-O1 -g", ldflags: ""}
          - {name: complex-i4, opts: "--enable-complex", cflags: "-O1 -g", ldflags: ""}
          - {name: real-i8, opts: "--enable-longlong", cflags: "-O1 -g", ldflags: ""}
          - {name: complex-asan, opts: "--enable-complex", cflags: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer", ldflags: "-fsanitize=address,undefined"}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool libtool-bin build-essential gfortran
      - name: Build and execute
        env:
          OMP_NUM_THREADS: '2'
          ASAN_OPTIONS: 'detect_leaks=1:halt_on_error=1'
          UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
        run: |
          autoreconf -fiv
          mkdir build && cd build
          CFLAGS="${{ matrix.cflags }} -Werror=implicit-function-declaration" LDFLAGS="${{ matrix.ldflags }}" ../configure ${{ matrix.opts }}
          make -j2
          make -C test testvectorreal64 testexternalstorage
          ./test/testvectorreal64
          ./test/testexternalstorage
