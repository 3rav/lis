name: Review integration BE and spectrum-aware restarts
on:
  push:
    branches: [ci/integration-both-ends-spectral-20261104]
jobs:
  numerical:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: gcc, cc: gcc, flags: "-O2 -Wall -Wextra"}
          - {name: clang, cc: clang, flags: "-O2 -Wall -Wextra"}
          - {name: openmp, cc: gcc, flags: "-O2 -fopenmp"}
          - {name: sanitizers, cc: gcc, flags: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: BE and spectral-adaptive integration verification
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          FLAGS: ${{ matrix.flags }}
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          OMP_NUM_THREADS: "4"
        run: |
          set -euo pipefail
          for test in both_ends spectral_restart modes unified api_contract; do
            "$CC" -std=c99 $FLAGS -Iinclude src/esolver/lis_krylov.c "test/test_krylov_$test.c" -lm -o "run_$test"
            "./run_$test" > "out_$test.log"
            tail -n 1 "out_$test.log"
          done
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify BE and BE:ASC exactly match pre-heuristic solver
        shell: bash
        run: |
          set -euo pipefail
          git show 80d84637255812d861e568d06c438a90a344a1bc:src/esolver/lis_krylov.c > baseline.c
          gcc -std=c99 -O2 -Iinclude baseline.c test/test_krylov_spectral_restart.c -lm -o before
          gcc -std=c99 -O2 -Iinclude src/esolver/lis_krylov.c test/test_krylov_spectral_restart.c -lm -o after
          ./before --be-only > before.log
          ./after --be-only > after.log
          diff -u before.log after.log
          test "$(grep -c '^CASE ' after.log)" = 60
          grep -q 'PASS BE compatible with spectrum-aware adaptive restarts' after.log
          echo 'PASS 60 BE/BE:ASC adaptive integration cases with exact baseline output parity'
