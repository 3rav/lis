name: Temporary reviewer CI (upstream develop snapshot)
on:
  push:
    branches:
      - ci/ready-ilut-safety
      - ci/ready-ilut-fea
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: serial
            options: ''
          - mode: openmp
            options: '--enable-omp'
          - mode: half-openmp
            options: '--enable-half --enable-omp'
    env:
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin python3
      - name: Build from exact upstream develop snapshot plus proposed change
        run: |
          autoreconf -fiv
          ./configure --enable-test --disable-fortran --disable-f90 --disable-saamg --disable-mpi ${{ matrix.options }}
          make -j2
      - name: Numerical safety probe (existing testilupivot)
        run: |
          set -euo pipefail
          ./test/testilupivot | tee numerical-probe.log
          grep -q '^LIS_ILUT_NUMERICAL_PROBE case=well_scaled ' numerical-probe.log
          grep -q '^LIS_ILUT_NUMERICAL_PROBE case=ill_scaled ' numerical-probe.log
          grep -q '^LIS_ILU_PIVOT_STAGE6B PASSED' numerical-probe.log
