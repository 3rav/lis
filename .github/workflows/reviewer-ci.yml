name: Temporary ILUT FEA reviewer CI
on:
  push:
    branches:
      - ci/ready-ilut-fea
permissions:
  contents: read
jobs:
  fea:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: half-serial
            options: '--enable-half'
          - mode: half-openmp
            options: '--enable-half --enable-omp'
    env:
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin python3
      - name: Build from exact upstream develop snapshot plus proposed change
        run: |
          autoreconf -fiv
          ./configure --enable-test --disable-fortran --disable-f90 --disable-saamg --disable-mpi ${{ matrix.options }}
          make -j2
      - name: Test successful and explicitly failed benchmark reporting
        run: |
          set -euo pipefail
          export EXPECTED_RCM_THREADS=1
          if [ "${{ matrix.mode }}" = "half-openmp" ]; then
            export EXPECTED_RCM_THREADS=2
          fi
          LIS_FEA_BASELINE_THREADS=1 LIS_FEA_RCM_THREADS="$EXPECTED_RCM_THREADS" ./test/testhalfilut \
            --fea-matrix test/testmat0.mtx 8 8 0.005 | tee bench.log
          python3 - <<'PY'
          import csv
          from pathlib import Path
          lines=Path('bench.log').read_text().splitlines()
          first=next(i for i,s in enumerate(lines) if s.startswith('variant,rate,'))
          rows=list(csv.DictReader(lines[first:]))
          assert [x['variant'] for x in rows]==['baseline','rcm_scaled'],rows
          for row in rows:
              import os
              expected = 1 if row["variant"]=="baseline" else int(os.environ["EXPECTED_RCM_THREADS"])
              assert int(row['threads'])==expected, row
              assert int(row['solver_error'])==0
              assert row['status'] in ('converged','not_converged')
              assert float(row['total_wall_s'])>=0
              assert row['target_1e-8_met']==('yes' if float(row['true_relres'])<=1e-8 else 'no')
          print('FEA_REVIEW_CSV_OK')
          PY
          set +e
          LIS_FEA_BASELINE_THREADS=0 ./test/testhalfilut \
            --fea-matrix test/testmat0.mtx 8 8 0.005 >invalid.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q '^baseline,' invalid.log
          grep -q '^rcm_scaled,' invalid.log
          echo FEA_FAILURE_ROWS_OK

          # Control one- versus two-thread RCM factorization and application
          # on the same Matrix Market input in the same Actions job.
          if [ "${{ matrix.mode }}" = "half-openmp" ]; then
            LIS_FEA_BASELINE_THREADS=1 LIS_FEA_RCM_THREADS=1 \
              ./test/testhalfilut --fea-matrix test/testmat0.mtx 8 8 0.005 \
              > fea-rcm-threads-1.log
            LIS_FEA_BASELINE_THREADS=1 LIS_FEA_RCM_THREADS=2 \
              ./test/testhalfilut --fea-matrix test/testmat0.mtx 8 8 0.005 \
              > fea-rcm-threads-2.log
            python3 - <<'PY'
          import csv
          from pathlib import Path
          def read_rows(path):
              lines=Path(path).read_text().splitlines()
              start=next(i for i,l in enumerate(lines) if l.startswith('variant,rate,'))
              rows=list(csv.DictReader(lines[start:]))
              return {r['variant']:r for r in rows}
          one=read_rows('fea-rcm-threads-1.log')
          two=read_rows('fea-rcm-threads-2.log')
          assert one['baseline']['threads']==two['baseline']['threads']=='1'
          assert one['baseline']['nnz_LU']==two['baseline']['nnz_LU']
          assert one['baseline']['iterations']==two['baseline']['iterations']
          assert one['rcm_scaled']['threads']=='1' and two['rcm_scaled']['threads']=='2'
          for count, rows in ((1,one),(2,two)):
              r=rows['rcm_scaled']
              assert int(r['solver_error'])==0, r
              print(f'ILUT_RCM_THREADS={count} nnz_LU={r["nnz_LU"]} '
                    f'iterations={r["iterations"]} true_relres={r["true_relres"]}')
          print('THREAD_DEPENDENCE_OBSERVED:',
                one['rcm_scaled']['nnz_LU']!=two['rcm_scaled']['nnz_LU'] or
                one['rcm_scaled']['iterations']!=two['rcm_scaled']['iterations'])
          PY
          fi

