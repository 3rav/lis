name: Ready review PR22 November 2026
on:
  push:
    branches: [ci/ready-krylov-pr22-20261104]
jobs:
  numerical:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: gcc, cc: gcc, flags: "-O2 -Wall -Wextra"}
          - {name: clang, cc: clang, flags: "-O2 -Wall -Wextra"}
          - {name: openmp, cc: gcc, flags: "-O2 -fopenmp"}
          - {name: sanitizers, cc: gcc, flags: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Numerical and regression verification
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          FLAGS: ${{ matrix.flags }}
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          OMP_NUM_THREADS: "4"
        run: |
          set -euo pipefail
          "$CC" -std=c99 $FLAGS test/test_krylov_davidson_prototype.c -lm -o test_target
          ./test_target > target.log
          tail -n 6 target.log
          "$CC" -std=c99 $FLAGS -Iinclude src/esolver/lis_krylov.c test/bench_krylov_davidson_compare.c -lm -o bench_target
          ./bench_target > bench.log
          tail -n 6 bench.log
  autotools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prerequisites
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libtool libtool-bin gfortran
      - name: Build with committed Makefile.in and focused make check
        shell: bash
        run: |
          set -euo pipefail
          mkdir build && cd build
          ../configure --enable-omp
          make -j2
          make -C test test_krylov_davidson_prototype test_krylov_unified test_krylov_api_contract
          make -C test check-TESTS TESTS='test_krylov_davidson_prototype'
          ./test/test_krylov_unified
          ./test/test_krylov_api_contract
          ./test/test_krylov_davidson_prototype
