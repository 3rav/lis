name: Anchor stage 9 paired synthetic benchmark
on:
  push:
    branches: ['experiment/anchor-stage7-native-20261126']
    paths:
      - 'tools/anchor_stage9_diagonal.py'
      - '.github/workflows/anchor-stage9-paired.yml'
      - 'tools/*anchor_pilot*'
      - 'src/solver/**'
      - 'include/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [release, asan-ubsan]
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool time
      - name: Build native LIS
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/head.txt
          python3 --version > evidence/python.txt
          gcc --version > evidence/gcc.txt
          flags=(-O2 -DNDEBUG); link=()
          if [[ $PROFILE == asan-ubsan ]]; then
            flags=(-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all)
            link=(-no-pie)
          fi
          ./configure --disable-mpi --enable-omp --disable-fortran --disable-f90 --disable-saamg --disable-test --disable-shared --enable-static CFLAGS="${flags[*]}" LDFLAGS="${flags[*]}" 2>&1 | tee evidence/configure.log
          make -j2 2>&1 | tee evidence/build.log
          cc "${flags[@]}" "${link[@]}" -fopenmp -DHAVE_CONFIG_H -Iinclude tools/lis_anchor_pilot.c tools/bench_anchor_pilot.c src/.libs/liblis.a -lm -o evidence/bench_anchor_pilot
      - name: Execute 135 timing cases and 135 independent audit cases
        run: |
          set -euo pipefail
          python3 tools/anchor_stage9_diagonal.py evidence/bench_anchor_pilot evidence/paired | tee evidence/paired.log
          grep -q '^DIAGONAL_PAIRED_GATE=PASS ' evidence/paired.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anchor-stage9-${{ matrix.profile }}-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
