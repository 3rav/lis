name: Reproduce allocator overflow on unmodified LIS
on:
  push:
    branches: [validation/allocator-overflow-baseline-20261031]
  workflow_dispatch:
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin gfortran
      - name: Build original allocator with regression test only
        run: |
          autoreconf -fiv
          mkdir build && cd build
          ../configure
          make -j2
      - name: Demonstrate overflow failure in unmodified source
        run: |
          cd build
          if ./test/testvectorreal64 >baseline.log 2>&1; then
            cat baseline.log
            echo "Unexpected pass on unmodified upstream"
            exit 1
          fi
          cat baseline.log
          grep -q 'ALLOCATOR_FAILURE_PATHS=FAIL' baseline.log
      - name: Save reproduction log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allocator-overflow-baseline
          path: build/baseline.log
          if-no-files-found: ignore
