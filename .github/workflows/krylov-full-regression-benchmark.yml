name: Native Krylov full regression (temporary validation branch)
on:
  push:
    branches: [ci/krylov-full-regression-benchmark]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [serial, openmp]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin pkg-config gfortran
      - name: Build from clean checkout
        run: |
          autoreconf -fiv
          mkdir build
          cd build
          if [ "${{ matrix.mode }}" = openmp ]; then ../configure --enable-omp; else ../configure; fi
          make -j2
      - name: Full LIS make check
        run: |
          cd build
          OMP_NUM_THREADS=2 make check -j2
      - name: Native Krylov focused suite
        if: always()
        run: |
          cd build
          make -C test test_krylov_modes test_krylov_sparse test_krylov_regression test_krylov_lis
          OMP_NUM_THREADS=2 make -C test check TESTS="test_krylov_modes test_krylov_sparse test_krylov_regression test_krylov_lis"
  asan_ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Numerical tests under sanitizers
        run: |
          set -eu
          for suite in modes sparse regression; do
            cc -O1 -g -std=c99 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude src/esolver/lis_krylov.c test/test_krylov_${suite}.c -lm -o /tmp/krylov_${suite}_asan
            ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 /tmp/krylov_${suite}_asan
          done
