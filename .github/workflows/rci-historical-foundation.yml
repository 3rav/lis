name: RCI historical foundation qualification
on:
  push:
    branches: ['work/rci-historical-foundation-20261127']
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        sanitizer: [none, asan-ubsan]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: bash
        run: |
          set -euo pipefail
          flags=(-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -Wno-misleading-indentation)
          if [ "${{ matrix.sanitizer }}" = asan-ubsan ]; then flags+=(-fsanitize=address,undefined -fno-sanitize-recover=all -g -fno-omit-frame-pointer -no-pie); fi
          "${{ matrix.cc }}" "${flags[@]}" -Iinclude -Iqualification/rci-restore/ src/lis_rci.c qualification/rci-restore/lis_rci_restore.c qualification/rci-restore/test_restore.c -lm -o "$RUNNER_TEMP/restore"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/restore"
          "${{ matrix.cc }}" "${flags[@]}" -Iinclude -Iqualification/rci-restore/ src/lis_rci.c qualification/rci-restore/lis_rci_restore.c qualification/rci-restore/lis_rci_split_restore.c qualification/rci-restore/test_split.c -lm -o "$RUNNER_TEMP/split"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/split"
          "${{ matrix.cc }}" "${flags[@]}" -Iinclude -Iqualification/rci-restore/ qualification/rci-restore/lis_rci_recycle_restore.c qualification/rci-restore/test_recycle.c -lm -o "$RUNNER_TEMP/recycle"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/recycle"
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [serial, openmp]
        index: [int32, int64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: bash
        run: |
          set -euo pipefail
          opts=(--enable-rci --enable-shared --disable-mpi --disable-quad --disable-fortran --disable-f90 --disable-saamg)
          flags=(-std=gnu11 -DHAVE_CONFIG_H -O2)
          if [ "${{ matrix.mode }}" = openmp ]; then opts+=(--enable-omp); flags+=(-fopenmp); else opts+=(--disable-omp); fi
          if [ "${{ matrix.index }}" = int64 ]; then opts+=(--enable-longlong); flags+=(-D_LONG__LONG); fi
          ./configure "${opts[@]}"
          make -C src -j2
          cc "${flags[@]}" -Iinclude -Iqualification/rci-restore/ qualification/rci-restore/lis_rci_native_restore.c qualification/rci-restore/test_native.c -Lsrc/.libs -Wl,-rpath,"$PWD/src/.libs" -llis -lm -o "$RUNNER_TEMP/native"
          ldd "$RUNNER_TEMP/native" | grep -F "$PWD/src/.libs/liblis.so"
          OMP_NUM_THREADS=1 "$RUNNER_TEMP/native"
          if [ "${{ matrix.mode }}" = openmp ]; then OMP_NUM_THREADS=4 "$RUNNER_TEMP/native"; fi
          cc "${flags[@]}" -Iinclude -Iqualification/rci-restore/ qualification/rci-restore/lis_rci_restore.c qualification/rci-restore/lis_rci_split_restore.c qualification/rci-restore/lis_rci_native_restore.c qualification/rci-restore/lis_rci_feast_restore.c qualification/rci-restore/test_feast.c -Lsrc/.libs -Wl,-rpath,"$PWD/src/.libs" -llis -lm -o "$RUNNER_TEMP/feast"
          OMP_NUM_THREADS=1 "$RUNNER_TEMP/feast"
          if [ "${{ matrix.mode }}" = openmp ]; then OMP_NUM_THREADS=4 "$RUNNER_TEMP/feast"; fi
          cc "${flags[@]}" -Iinclude -Iqualification/rci-restore/ qualification/rci-restore/lis_rci_native_restore.c qualification/rci-restore/lis_rci_recycle_restore.c qualification/rci-restore/lis_rci_augmented_restore.c qualification/rci-restore/test_augmented.c -Lsrc/.libs -Wl,-rpath,"$PWD/src/.libs" -llis -lm -o "$RUNNER_TEMP/augmented"
          OMP_NUM_THREADS=1 "$RUNNER_TEMP/augmented"
          if [ "${{ matrix.mode }}" = openmp ]; then OMP_NUM_THREADS=4 "$RUNNER_TEMP/augmented"; fi
