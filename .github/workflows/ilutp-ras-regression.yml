name: ILUTP and RAS regression

on:
  push:
    branches:
      - 'perf/develop-ilutp-ras-20261119'
  pull_request:
  workflow_dispatch:

jobs:
  ilutp-ras:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [release, asan-ubsan]
    env:
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Configure and compile
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          if [ "${{ matrix.mode }}" = asan-ubsan ]; then
            export CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
            export LDFLAGS="-fsanitize=address,undefined"
          else
            export CFLAGS="-O2 -g"
          fi
          ./configure --enable-test --enable-omp --enable-half --disable-mpi \
            --disable-fortran --disable-f90 --disable-saamg
          make -j2
          make -C test testhalfilut
      - name: Run ILUTP, pivot and RAS checks
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          OMP_NUM_THREADS=1 ./test/testilutp
          OMP_NUM_THREADS=1 ./test/testhalfilut --parallel-ras-ilutp
          OMP_NUM_THREADS=8 ./test/testhalfilut --parallel-ras-ilutp
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ilutp-ras-${{ matrix.mode }}
          path: |
            config.log
            test/*.log
          if-no-files-found: ignore

  ilutp-ras-tsan:
    name: RAS OpenMP race audit (TSan/Archer)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '8'
      OMP_DYNAMIC: 'FALSE'
      TSAN_OPTIONS: 'halt_on_error=1:exitcode=66:ignore_noninstrumented_modules=1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang and LLVM Archer
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin clang-18 libomp-18-dev llvm-18
      - name: Build LIS with ThreadSanitizer
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          ./configure --enable-test --enable-omp --enable-half --disable-mpi \
            --disable-fortran --disable-f90 --disable-saamg \
            CC=clang-18 CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=thread" \
            LDFLAGS="-fsanitize=thread"
          make -j2
          make -C test testhalfilut
      - name: Audit eight-thread RAS ILUTP
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          export LLVM_SYMBOLIZER_PATH=/usr/bin/llvm-symbolizer-18
          archer=$(find /usr/lib/llvm-18 -name libarcher.so | head -1)
          test -f "$archer"
          export OMP_TOOL_LIBRARIES="$archer"
          ./test/testhalfilut --parallel-ras-ilutp 2>&1 | tee ilutp-ras-tsan.log
          grep -q 'ILUT_RAS_LOCAL_ILUTP threads=8' ilutp-ras-tsan.log
      - name: Upload race diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ilutp-ras-tsan-diagnostics
          path: |
            config.log
            ilutp-ras-tsan.log
          if-no-files-found: ignore
