name: LIS full regression (isolated)

on:
  push:
    branches:
      - validation/pr159-full-regression-20261030
  workflow_dispatch:

jobs:
  linux:
    name: Full check Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: real-i4, opts: "", cc: cc }
          - { name: real-i8, opts: "--enable-longlong", cc: cc }
          - { name: complex-i4, opts: "--enable-complex", cc: cc }
          - { name: complex-i8, opts: "--enable-complex --enable-longlong", cc: cc }
          - { name: real-openmp, opts: "--enable-omp", cc: cc }
          - { name: complex-openmp, opts: "--enable-complex --enable-omp", cc: cc }
          - { name: real-longdouble, opts: "--enable-longdouble", cc: cc }
          - { name: mpi-one-rank, opts: "--enable-mpi", cc: mpicc }
    steps:
      - uses: actions/checkout@v4
      - name: Install LIS toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin gfortran openmpi-bin libopenmpi-dev
      - name: Configure and compile
        run: |
          autoreconf -fiv
          mkdir build && cd build
          ../configure CC=${{ matrix.cc }} ${{ matrix.opts }}
          make -j2
      - name: Execute full Automake regression suite
        env:
          OMP_NUM_THREADS: "2"
          OMP_DYNAMIC: "FALSE"
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: |
          cd build
          set -o pipefail
          timeout 45m make -j2 check 2>&1 | tee full-check.log
          echo '--- Test summaries ---'
          find . -name test-suite.log -print -exec tail -n 50 {} \;
      - name: Save detailed regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}-full-check
          path: |
            build/full-check.log
            build/**/test-suite.log
            build/**/test-suite*.log
          if-no-files-found: ignore

  ucrt64:
    name: Full check Windows UCRT64 ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: i4, opts: "" }
          - { name: i8, opts: "--enable-longlong" }
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
      - name: Configure and compile
        shell: msys2 {0}
        run: |
          autoreconf -fiv
          mkdir build && cd build
          ../configure ${{ matrix.opts }}
          make -j2
      - name: Execute full Automake regression suite
        shell: msys2 {0}
        env:
          OMP_NUM_THREADS: "2"
          OMP_DYNAMIC: "FALSE"
        run: |
          cd build
          set -o pipefail
          timeout 45m make -j2 check 2>&1 | tee full-check.log
          echo '--- Test summaries ---'
          find . -name test-suite.log -print -exec tail -n 50 {} \;
      - name: Save detailed regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ucrt64-${{ matrix.name }}-full-check
          path: |
            build/full-check.log
            build/**/test-suite.log
            build/**/test-suite*.log
          if-no-files-found: ignore
