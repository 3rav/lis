name: FGCRO-DR opt-in Ritz stride correctness

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: fgcrodr-ritz-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  serial:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [release, asan-ubsan]
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          if [ "${{ matrix.mode }}" = asan-ubsan ]; then
            export CFLAGS='-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined'
            export LDFLAGS='-fsanitize=address,undefined'
            export ASAN_OPTIONS='detect_leaks=0'
          else
            export CFLAGS='-O2 -g'
          fi
          ./configure --enable-test --enable-omp --disable-mpi --disable-fortran --disable-f90 --disable-saamg
          make -j2
      - name: Validate stride and existing numerical / recycling semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ritz-stride-results
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          if [ "${{ matrix.mode }}" = asan-ubsan ]; then
            export ASAN_OPTIONS='detect_leaks=1:halt_on_error=1'
          fi
          for program in testfgcrodrintra testfgcrodrtransport testfgcrodrmaxiter testfgcrodr; do
            ./test/$program > ritz-stride-results/$program.log 2>&1 || {
              tail -n 75 ritz-stride-results/$program.log
              exit 1
            }
            echo "PASS $program"
          done
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fgcrodr-ritz-${{ matrix.mode }}
          path: |
            ritz-stride-results/
            config.log
          if-no-files-found: ignore

  mpi:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenMPI
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin openmpi-bin libopenmpi-dev
      - name: Build MPI
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          ./configure --enable-test --enable-mpi --enable-omp --disable-fortran --disable-f90 --disable-saamg CFLAGS='-O2 -g'
          make -j2
      - name: Verify per-rank stride consistency and transport on 2 MPI ranks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ritz-stride-results
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          for program in testfgcrodrintra testfgcrodrtransport; do
            timeout 150s mpirun --oversubscribe --bind-to none -np 2 ./test/$program > ritz-stride-results/$program-mpi.log 2>&1 || {
              tail -n 75 ritz-stride-results/$program-mpi.log
              exit 1
            }
            echo "PASS MPI: $program"
          done
          grep -q 'FGCRODR_MPI_MODE_MISMATCH_REJECTED_OK mode=4' ritz-stride-results/testfgcrodrintra-mpi.log
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fgcrodr-ritz-mpi
          path: |
            ritz-stride-results/
            config.log
          if-no-files-found: ignore
