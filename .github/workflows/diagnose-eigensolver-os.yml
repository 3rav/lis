name: Diagnose eigensolver OS crossover (temporary)

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  eigensolver-compat:
    name: "${{ matrix.target }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        target: [base, head]
    env:
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - name: Checkout selected tree (no implicit merge)
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target == 'base' && github.event.pull_request.base.repo.full_name || github.event.pull_request.head.repo.full_name }}
          ref: ${{ matrix.target == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
      - name: Show runner and compiler
        run: |
          cat /etc/os-release
          gcc --version | head -1
          git rev-parse HEAD
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Configure and build
        run: |
          autoreconf -fiv
          ./configure --enable-test --disable-fortran --disable-f90 \
            --disable-saamg --disable-mpi
          make -j2
      - name: Run three unchanged eigensolver regressions
        shell: bash
        run: |
          set +e
          ./test/testeigenbreakdown > /tmp/ebreak.log 2>&1; a=$?
          ./test/test_krylov_unified > /tmp/unified.log 2>&1; b=$?
          ./test/test_krylov_openmp > /tmp/openmp.log 2>&1; c=$?
          echo "=== EIGEN BREAKDOWN (rc=$a) ==="; tail -n 45 /tmp/ebreak.log
          echo "=== KRYLOV UNIFIED (rc=$b) ==="; tail -n 45 /tmp/unified.log
          echo "=== KRYLOV OPENMP (rc=$c) ==="; tail -n 45 /tmp/openmp.log
          if (( a || b || c )); then exit 1; fi
