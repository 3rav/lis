name: RCO memory regression and LIS build

on:
  pull_request:
    paths:
      - 'src/matrix/lis_matrix.c'
      - 'src/matrix/lis_matrix_rco.c'
      - 'test/testrcoalloc.py'
      - '.github/workflows/rco-memory.yml'
  push:
    branches:
      - 'fix/rco-allocation-failure-cleanup-*'
    paths:
      - 'src/matrix/lis_matrix.c'
      - 'src/matrix/lis_matrix_rco.c'
      - 'test/testrcoalloc.py'
      - '.github/workflows/rco-memory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  allocation-faults:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify RCO allocation failures
        run: python3 test/testrcoalloc.py
      - name: Verify RCO allocation failures with sanitizers
        env:
          LIS_RCO_ASAN: '1'
        run: python3 test/testrcoalloc.py

  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: serial
            configure_flags: ''
            threads: '1'
          - label: openmp
            configure_flags: '--enable-omp'
            threads: '2'
    name: Build and smoke test (${{ matrix.label }})
    env:
      OMP_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v4
      - name: Install LIS build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin pkg-config gfortran
      - name: Generate autotools inputs
        run: autoreconf -fiv
      - name: Configure and compile
        run: |
          mkdir -p build-ci
          cd build-ci
          ../configure ${{ matrix.configure_flags }}
          make -j2
      - name: Smoke test CSR solver and user operator
        run: |
          cd build-ci
          ./test/testuser
          ./test/test3 4 4 4 1 /dev/null /dev/null -i cg -p jacobi -tol 1.0e-9 -print none
