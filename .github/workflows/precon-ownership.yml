name: Preconditioner ownership failure injection

on:
  pull_request:
    paths:
      - 'src/solver/lis_solver.c'
      - 'test/testpreconownership.c'
      - 'test/Makefile.am'
      - '.github/workflows/precon-ownership.yml'
  push:
    branches:
      - 'fix/precon-kernel-error-ownership-*'
    paths:
      - 'src/solver/lis_solver.c'
      - 'test/testpreconownership.c'
      - 'test/Makefile.am'
      - '.github/workflows/precon-ownership.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: serial
            flags: ''
            threads: '1'
          - label: openmp
            flags: '--enable-omp'
            threads: '2'
          - label: 64-bit-indices
            flags: '--enable-longlong'
            threads: '1'
    name: Ownership test (${{ matrix.label }})
    env:
      OMP_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin pkg-config gfortran
      - name: Generate configure files and compile
        run: |
          autoreconf -fiv
          mkdir build-precon-ownership
          cd build-precon-ownership
          ../configure ${{ matrix.flags }}
          make -j2
          make -C test testpreconownership testsolvehistory
      - name: Inject allocation failure and validate ownership
        run: ./build-precon-ownership/test/testpreconownership
      - name: Check repeated solves remain correct
        run: ./build-precon-ownership/test/testsolvehistory
