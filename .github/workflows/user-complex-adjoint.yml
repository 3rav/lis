name: USER complex adjoint regression
on:
  pull_request:
    paths:
      - 'src/matvec/lis_matvec_csr.c'
      - 'src/matrix/**'
      - 'src/precon/**'
      - 'src/solver/lis_solver.c'
      - 'src/matvec/lis_matvec.c'
      - 'src/vector/**'
      - 'src/precon/lis_precon.c'
      - 'src/system/lis_memory.c'
      - 'include/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - 'test/testusercomplexadjoint.c'
      - '.github/workflows/user-complex-adjoint.yml'
  push:
    branches:
      - develop
      - 'test/user-complex-adjoint-20261125'
    paths:
      - 'src/matvec/lis_matvec_csr.c'
      - 'src/matrix/**'
      - 'src/precon/**'
      - 'src/solver/lis_solver.c'
      - 'src/matvec/lis_matvec.c'
      - 'src/vector/**'
      - 'src/precon/lis_precon.c'
      - 'src/system/lis_memory.c'
      - 'include/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - 'test/testusercomplexadjoint.c'
      - '.github/workflows/user-complex-adjoint.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  complex-adjoint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name != 'pull_request' && '[{"mode":"release","index":"int32"},{"mode":"release","index":"int64"},{"mode":"asan-ubsan","index":"int32"},{"mode":"asan-ubsan","index":"int64"}]' || '[{"mode":"release","index":"int32"},{"mode":"asan-ubsan","index":"int64"}]') }}
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Build and test complex adjoint
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          if [ "${{ matrix.mode }}" = asan-ubsan ]; then
            export CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
            export LDFLAGS="-fsanitize=address,undefined"
          else
            export CFLAGS="-O2 -g"
            export LDFLAGS=""
          fi
          index_flags=""
          if [ "${{ matrix.index }}" = int64 ]; then
            index_flags="--enable-longlong"
          fi
          ./configure --enable-complex --enable-omp --enable-test --disable-mpi --disable-fortran --disable-f90 --disable-saamg ${index_flags}
          make -C src -j2
          make -C test testusercomplexadjoint
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          OMP_NUM_THREADS=1 ./test/testusercomplexadjoint
          OMP_NUM_THREADS=4 ./test/testusercomplexadjoint
