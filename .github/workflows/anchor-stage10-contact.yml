name: Anchor stage 10 contact-like sparse benchmark
on:
  push:
    branches: ['experiment/anchor-stage7-native-20261126']
    paths:
      - 'tools/anchor_stage10_contact.py'
      - '.github/workflows/anchor-stage10-contact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contact:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: release, width: 32, height: 32, reps: 3}
          - {profile: release, width: 100, height: 100, reps: 3}
          - {profile: release, width: 240, height: 250, reps: 1}
          - {profile: asan-ubsan, width: 32, height: 32, reps: 1}
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool time
      - name: Build native LIS
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/head.txt
          gcc --version > evidence/gcc.txt
          python3 --version > evidence/python.txt
          python3 -m py_compile tools/anchor_stage10_contact.py
          flags=(-O2 -DNDEBUG); link=()
          if [[ $PROFILE == asan-ubsan ]]; then
            flags=(-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all)
            link=(-no-pie)
          fi
          ./configure --disable-mpi --enable-omp --disable-fortran --disable-f90 --disable-saamg --disable-test --disable-shared --enable-static CFLAGS="${flags[*]}" LDFLAGS="${flags[*]}" 2>&1 | tee evidence/configure.log
          make -j2 2>&1 | tee evidence/build.log
          cc "${flags[@]}" "${link[@]}" -fopenmp -DHAVE_CONFIG_H -Iinclude tools/lis_anchor_pilot.c tools/bench_anchor_pilot.c src/.libs/liblis.a -lm -o evidence/bench_anchor_pilot
      - name: Paired contact benchmark
        env:
          WIDTH: ${{ matrix.width }}
          HEIGHT: ${{ matrix.height }}
          REPS: ${{ matrix.reps }}
        run: |
          set -euo pipefail
          python3 tools/anchor_stage10_contact.py evidence/bench_anchor_pilot evidence/contact --width "$WIDTH" --height "$HEIGHT" --reps "$REPS" | tee evidence/contact.log
          grep -q '^CONTACT_GATE=PASS ' evidence/contact.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anchor-stage10-${{ matrix.profile }}-${{ matrix.width }}x${{ matrix.height }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
