name: Validate quad vector work lifecycle with sanitizers
on:
  push:
    branches: [validation/quad-unset-work-asan-ci-20261031]
  workflow_dispatch:
jobs:
  quad:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: quad-real, opts: "--enable-quad"}
          - {name: quad-real-omp, opts: "--enable-quad --enable-omp"}
          - {name: quad-complex, opts: "--enable-quad --enable-complex"}
          - {name: quad-complex-omp, opts: "--enable-quad --enable-complex --enable-omp"}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin gfortran
      - name: Configure and build
        run: |
          autoreconf -fiv
          mkdir build && cd build
          CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" LDFLAGS="-fsanitize=address,undefined" ../configure ${{ matrix.opts }}
          make -j2
      - name: Full regression and targeted repeated unset/reuse
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          OMP_NUM_THREADS: "2"
        run: |
          cd build
          set -o pipefail
          timeout 25m make -j2 check 2>&1 | tee full-quad-asan-check.log
          ./test/testsolvercallbackpaths
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.name }}
          path: |
            build/full-quad-asan-check.log
            build/**/test-suite.log
          if-no-files-found: ignore
