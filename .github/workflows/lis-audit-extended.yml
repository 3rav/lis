name: LIS PR5 extended validation
on:
  push:
    branches: [validation/lis-a-extra-20261101]
jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: complex-longdouble, opts: "--enable-complex --enable-longdouble", cc: cc, cflags: "-O1 -g", ldflags: ""}
          - {name: complex-i8, opts: "--enable-complex --enable-longlong", cc: cc, cflags: "-O1 -g", ldflags: ""}
          - {name: mpi-one-rank, opts: "--enable-mpi", cc: mpicc, cflags: "-O1 -g", ldflags: ""}
          - {name: complex-asan-ubsan, opts: "--enable-complex", cc: cc, cflags: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer", ldflags: "-fsanitize=address,undefined"}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin gfortran openmpi-bin libopenmpi-dev
      - name: Build and run regressions
        env:
          OMP_NUM_THREADS: '2'
          OMP_DYNAMIC: 'FALSE'
          ASAN_OPTIONS: 'detect_leaks=1:halt_on_error=1:abort_on_error=1'
          UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
        run: |
          autoreconf -fiv
          mkdir build && cd build
          CC=${{ matrix.cc }} CFLAGS="${{ matrix.cflags }} -Werror=implicit-function-declaration" LDFLAGS="${{ matrix.ldflags }}" ../configure ${{ matrix.opts }}
          make -j2
          make -C test testmatrixautosession testmatrixmaterialize testmatrixpolicysolve testpreconreuse
          ./test/testmatrixautosession
          ./test/testmatrixmaterialize
          ./test/testmatrixpolicysolve
          ./test/testpreconreuse
