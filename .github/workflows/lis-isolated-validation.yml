name: LIS isolated ready-review validation

on:
  push:
    branches:
      - validation/pr159-ready-20261030
  workflow_dispatch:

jobs:
  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: real-i4, opts: "" }
          - { name: real-i8, opts: "--enable-longlong" }
          - { name: complex-i4, opts: "--enable-complex" }
          - { name: complex-i8, opts: "--enable-complex --enable-longlong" }
          - { name: real-openmp, opts: "--enable-omp" }
          - { name: complex-openmp, opts: "--enable-complex --enable-omp" }
          - { name: real-longdouble, opts: "--enable-longdouble" }
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin gfortran
      - name: Build
        run: |
          autoreconf -fiv
          mkdir build
          cd build
          ../configure ${{ matrix.opts }}
          make -j2
          make -C test testmatrixautosession testmatrixmaterialize testcapabilities testvectorreal64
      - name: Run targeted regressions
        env:
          OMP_NUM_THREADS: '4'
          OMP_DYNAMIC: 'FALSE'
        run: |
          cd build
          ./test/testmatrixautosession
          ./test/testmatrixmaterialize
          ./test/testcapabilities
          ./test/testvectorreal64
          make -C test check-TESTS 'TESTS=testmatrixautosession$(EXEEXT) testvectorreal64$(EXEEXT)'

  sanitizers:
    name: ASan / UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin gfortran
      - name: Build and run
        env:
          ASAN_OPTIONS: 'detect_leaks=1:halt_on_error=1'
          UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
        run: |
          autoreconf -fiv
          mkdir build
          cd build
          CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" LDFLAGS="-fsanitize=address,undefined" ../configure --enable-omp
          make -j2
          make -C test testmatrixautosession testmatrixmaterialize testcapabilities testvectorreal64
          ./test/testmatrixautosession
          ./test/testmatrixmaterialize
          ./test/testcapabilities
          ./test/testvectorreal64
          make -C test check-TESTS 'TESTS=testmatrixautosession$(EXEEXT) testvectorreal64$(EXEEXT)'

  msys2-ucrt64:
    name: Windows UCRT64 ${{ matrix.name }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: i4, opts: "" }
          - { name: i8, opts: "--enable-longlong" }
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
      - name: Configure and test
        shell: msys2 {0}
        run: |
          autoreconf -fiv
          mkdir build
          cd build
          ../configure ${{ matrix.opts }}
          make -j2
          make -C test testmatrixautosession testmatrixmaterialize testcapabilities testvectorreal64
          ./test/testmatrixautosession.exe
          ./test/testmatrixmaterialize.exe
          ./test/testcapabilities.exe
          ./test/testvectorreal64.exe
          make -C test check-TESTS 'TESTS=testmatrixautosession$(EXEEXT) testvectorreal64$(EXEEXT)'
