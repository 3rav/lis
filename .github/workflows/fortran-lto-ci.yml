name: Validate Fortran CHARACTER ABI with GCC LTO
on:
  push:
    branches: [validation/fortran-lto-gcc-20261031]
  workflow_dispatch:
jobs:
  lto:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: fortran, options: "--enable-fortran"}
          - {variant: fortran-openmp, options: "--enable-fortran --enable-omp"}
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin gfortran
      - name: Build with strict link-time type checking
        run: |
          autoreconf -fiv
          mkdir build && cd build
          CFLAGS="-O1 -g -flto -Werror=lto-type-mismatch" \
          FFLAGS="-O1 -g -flto -Werror=lto-type-mismatch" \
          FCFLAGS="-O1 -g -flto -Werror=lto-type-mismatch" \
          LDFLAGS="-flto -Werror=lto-type-mismatch" \
          ../configure ${{ matrix.options }}
          make -j2
      - name: Run Fortran example and regression tests
        run: |
          cd build
          set -o pipefail
          timeout 20m make -j2 check 2>&1 | tee fortran-lto-check.log
      - name: Preserve test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lto-${{ matrix.variant }}
          path: |
            build/fortran-lto-check.log
            build/**/test-suite.log
          if-no-files-found: ignore
