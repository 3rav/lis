name: Temporary incremental Ritz-screen comparison over PR 179
on:
  push:
    branches: [experiment/krylov-ritz-screen-on-reuse-20261104]
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Compare actual callbacks over verified residual reuse
        shell: bash
        run: |
          set -euo pipefail
          git show 2a592abd538d1889b30921826f861203ad8431fd:src/esolver/lis_krylov.c > baseline.c
          gcc -std=c99 -O2 -DKRYLOV_BASELINE_COMPARISON -Iinclude baseline.c test/test_krylov_residual_reuse.c -lm -o before
          gcc -std=c99 -O2 -Iinclude src/esolver/lis_krylov.c test/test_krylov_residual_reuse.c -lm -o after
          ./before > before.log
          ./after > after.log
          python3 - <<'PY'
          from math import isclose
          a=open("before.log").read().splitlines()
          b=open("after.log").read().splitlines()
          assert len(a)==len(b),(len(a),len(b))
          saved=improved=regressed=cases=0
          for xo,yo in zip(a,b):
              x,y=xo.split(),yo.split()
              if x[0]=="CASE":
                  cases+=1
                  assert x[:14]==y[:14],(xo,yo)
                  assert x[16]==y[16],(xo,yo)
                  assert len(x)==len(y)
                  for u,v in zip(x[17:],y[17:]):
                      assert isclose(float(u),float(v),rel_tol=1e-11,abs_tol=2e-12),(u,v)
                  d=int(x[14])-int(y[14])
                  if d>0:
                      print("INCREMENT",tuple(x[1:7]),"A",x[14],"->",y[14],"saved",d)
                      improved+=1
                  if d<0: regressed+=1
                  saved+=d
              elif x[0]=="VECTOR":
                  assert len(x)==len(y)
                  for u,v in zip(x[1:],y[1:]):
                      assert isclose(float(u),float(v),rel_tol=1e-11,abs_tol=2e-12),(u,v)
              else: assert xo==yo,(xo,yo)
          assert cases==96
          assert regressed==0,(saved,regressed)
          print("INCREMENTAL SAVINGS on PR179 apply_a",saved,"improved",improved,"regressed",regressed,"cases",cases)
          PY
