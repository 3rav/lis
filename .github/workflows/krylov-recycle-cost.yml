name: GCRODR and FGCRODR exploratory timing

on:
  push:
    branches: ['bench/gcrodr-fgcrodr-cost-20261119']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Build native LIS solver benchmark
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          ./configure --enable-test --enable-omp --disable-mpi --disable-fortran --disable-f90 --disable-saamg CFLAGS='-O2 -g'
          make -j2
          make -C test bench_recycle_cost
      - name: Time first and recycled solves at two problem sizes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p krylov-recycle-cost
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          ./test/bench_recycle_cost 28 4 > krylov-recycle-cost/n28.csv 2> krylov-recycle-cost/n28.stderr
          ./test/bench_recycle_cost 40 4 > krylov-recycle-cost/n40.csv 2> krylov-recycle-cost/n40.stderr
          tail -n 12 krylov-recycle-cost/n40.csv
      - name: Preserve timings and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcrodr-fgcrodr-cost-${{ github.run_id }}
          path: krylov-recycle-cost/
          if-no-files-found: warn
