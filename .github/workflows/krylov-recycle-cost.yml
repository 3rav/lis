name: GCRODR and FGCRODR exploratory timing

on:
  push:
    branches: ['bench/gcrodr-fgcrodr-cost-20261119']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Build native LIS solver benchmark
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          ./configure --enable-test --enable-omp --disable-mpi --disable-fortran --disable-f90 --disable-saamg CFLAGS='-O2 -g -DLIS_RECYCLE_THROTTLE_EXPERIMENT'
          make -j2
          make -C test bench_recycle_cost
      - name: Time first and recycled solves at two problem sizes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p krylov-recycle-cost
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          for precon in jacobi ilutp; do
            mkdir -p "krylov-recycle-cost/$precon"
            for mode in 1 4 once 1_repeat; do
              if [ "$mode" = "1_repeat" ]; then
                export LIS_EXPERIMENT_RITZ_STRIDE=1
              else
                export LIS_EXPERIMENT_RITZ_STRIDE="$mode"
              fi
              for side in 28 40; do
                ./test/bench_recycle_cost "$side" 4 "$precon" \
                  > "krylov-recycle-cost/$precon/n${side}-${mode}.csv" \
                  2> "krylov-recycle-cost/$precon/n${side}-${mode}.stderr"
              done
            done
            python3 tools/audit_recycle_cadence.py "krylov-recycle-cost/$precon" \
              | tee "krylov-recycle-cost/$precon/summary.txt"
          done
      - name: Preserve timings and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcrodr-fgcrodr-cost-${{ github.run_id }}
          path: krylov-recycle-cost/
          if-no-files-found: warn
