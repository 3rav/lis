name: LIS audit PR6 validation
on:
  push:
    branches:
      - feature/real64-tolerant-export-20261031
  workflow_dispatch:
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: real-serial-i4, opts: ""}
          - {name: real-openmp-i4, opts: "--enable-omp"}
          - {name: complex-serial-i4, opts: "--enable-complex"}
          - {name: complex-openmp-i4, opts: "--enable-complex --enable-omp"}
          - {name: real-serial-i8, opts: "--enable-longlong"}
          - {name: real-longdouble-i4, opts: "--enable-longdouble"}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool libtool-bin build-essential gfortran
      - name: Build and test
        env:
          OMP_NUM_THREADS: '4'
          OMP_DYNAMIC: 'FALSE'
        run: |
          autoreconf -fiv
          mkdir build && cd build
          ../configure ${{ matrix.opts }} CFLAGS="-O1 -g -Werror=implicit-function-declaration"
          make -j2
          make -C test testvectorreal64 testexternalstorage
          ./test/testvectorreal64
          ./test/testexternalstorage
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool libtool-bin build-essential gfortran
      - name: Build and test with ASan/UBSan
        env:
          OMP_NUM_THREADS: '2'
          OMP_DYNAMIC: 'FALSE'
          ASAN_OPTIONS: 'detect_leaks=1:halt_on_error=1:abort_on_error=1'
          UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
        run: |
          autoreconf -fiv
          mkdir build && cd build
          ../configure CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Werror=implicit-function-declaration" LDFLAGS="-fsanitize=address,undefined"
          make -j2
          make -C test testvectorreal64 testexternalstorage
          ./test/testvectorreal64
          ./test/testexternalstorage
