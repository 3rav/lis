name: Verify tracked Autotools FILECMD templates
on:
  pull_request:
  push:
    branches: [fix/autotools-filecmd-sync-20261120]
  workflow_dispatch:
jobs:
  generated-file-sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Autotools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool libtool-bin
      - name: Confirm four generated Makefile.in templates are clean
        shell: bash
        run: |
          set -euo pipefail
          # The committed templates were generated by Automake 1.18.1.
          # Ubuntu 24.04 installs 1.16.5, which rewrites many unrelated
          # sections; a byte-for-byte diff is only meaningful on 1.18.1.
          for path in include/Makefile.in src/matrix/Makefile.in src/precon/Makefile.in test/Makefile.in; do
            grep -Fqx 'FILECMD = @FILECMD@' "$path"
          done
          version="$(automake --version | head -1 | awk '{print $NF}')"
          autoreconf -fiv
          if [ "$version" = '1.18.1' ]; then
            git diff --exit-code -- include/Makefile.in src/matrix/Makefile.in src/precon/Makefile.in test/Makefile.in
          else
            echo "Automake $version differs from tracked generator 1.18.1; strict diff skipped"
          fi
          echo 'AUTOTOOLS_FILECMD_SYNC PASS'
