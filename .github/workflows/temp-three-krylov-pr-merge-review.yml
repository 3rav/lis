name: Temporary post-merge Krylov PR validation

on:
  push:
    branches:
      - validation/updated-upstream-develop-20261104

jobs:
  numerical:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 175
            ref: feature/krylov-reusable-workspace-20261103
            sha: 45f91dca82d6c0b60f21a0692d1e2e184a42a0ad
            extras: "workspace"
          - pr: 177
            ref: feature/krylov-block-restart-20261103
            sha: f192e43e0dcbc67766e23eba8f87c5e7df6e4a55
            extras: "block_restart"
          - pr: 178
            ref: feature/krylov-abi-preserving-unified-20261104
            sha: 5fbe7854b7c2de3cdb653230694b01ab064aad8e
            extras: "workspace unified adaptive_ex api_contract"
    name: Native PR ${{ matrix.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Validate rebased source and regressions
        shell: bash
        env:
          EXPECTED: ${{ matrix.sha }}
          EXTRAS: ${{ matrix.extras }}
          OMP_NUM_THREADS: "4"
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          for cc in gcc clang; do
            for test in projected modes regression semidefinite stress $EXTRAS; do
              "$cc" -O2 -std=c99 -Iinclude src/esolver/lis_krylov.c "test/test_krylov_${test}.c" -lm -o krylov_test
              ./krylov_test
            done
          done
          gcc -O2 -fopenmp -std=c99 -Iinclude src/esolver/lis_krylov.c test/test_krylov_openmp.c -lm -o openmp_test
          ./openmp_test
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -std=c99 -Iinclude src/esolver/lis_krylov.c test/test_krylov_projected.c -lm -o sanitize_test
          ./sanitize_test

  full-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 175
            ref: feature/krylov-reusable-workspace-20261103
            sha: 45f91dca82d6c0b60f21a0692d1e2e184a42a0ad
            extras: "test_krylov_workspace"
          - pr: 177
            ref: feature/krylov-block-restart-20261103
            sha: f192e43e0dcbc67766e23eba8f87c5e7df6e4a55
            extras: "test_krylov_block_restart"
          - pr: 178
            ref: feature/krylov-abi-preserving-unified-20261104
            sha: 5fbe7854b7c2de3cdb653230694b01ab064aad8e
            extras: "test_krylov_workspace test_krylov_unified test_krylov_adaptive_ex test_krylov_api_contract"
    name: Autotools PR ${{ matrix.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Install Autotools dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin gfortran
      - name: Build LIS and run integrated adapter
        shell: bash
        env:
          EXPECTED: ${{ matrix.sha }}
          EXTRAS: ${{ matrix.extras }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          autoreconf -fiv
          mkdir build && cd build
          ../configure --enable-omp
          make -j2
          make -C test test_krylov_lis test_krylov_projected $EXTRAS
          ./test/test_krylov_lis
          ./test/test_krylov_projected
          for exe in $EXTRAS; do ./test/"$exe"; done
