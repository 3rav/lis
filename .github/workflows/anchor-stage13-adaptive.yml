name: Anchor stage 13 adaptive pilot holdout
on:
  push:
    branches: ['experiment/anchor-stage7-native-20261126']
    paths:
      - 'tools/anchor_stage13_adaptive.py'
      - '.github/workflows/anchor-stage13-adaptive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {width: 32, height: 32, reps: 3, stress: normal}
          - {width: 32, height: 32, reps: 3, stress: stress}
          - {width: 100, height: 100, reps: 3, stress: normal}
          - {width: 100, height: 100, reps: 3, stress: stress}
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool
      - name: Build native LIS once
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/head.txt
          python3 -m py_compile tools/anchor_stage10_contact.py tools/anchor_stage13_adaptive.py
          ./configure --disable-mpi --enable-omp --disable-fortran --disable-f90 --disable-saamg --disable-test --disable-shared --enable-static CFLAGS="-O2 -DNDEBUG" 2>&1 | tee evidence/configure.log
          make -j2 2>&1 | tee evidence/build.log
      - name: Screen adaptive pilot candidates with independent audits
        env:
          WIDTH: ${{ matrix.width }}
          HEIGHT: ${{ matrix.height }}
          REPS: ${{ matrix.reps }}
          CASE: ${{ matrix.stress }}
        run: |
          set -euo pipefail
          extra=()
          if [[ $CASE == stress ]]; then extra=(--stress); fi
          python3 tools/anchor_stage13_adaptive.py evidence/adaptive --width "$WIDTH" --height "$HEIGHT" --reps "$REPS" "${extra[@]}" | tee evidence/sweep.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anchor-stage13-${{ matrix.width }}x${{ matrix.height }}-${{ matrix.stress }}
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
