name: Validate BE hard-lock flank accounting
on:
  push:
    branches: [ci/review-both-ends-lock-side-20261104]
jobs:
  numerical:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: gcc, cc: gcc, flags: "-O2 -Wall -Wextra"}
          - {name: clang, cc: clang, flags: "-O2 -Wall -Wextra"}
          - {name: openmp, cc: gcc, flags: "-O2 -fopenmp"}
          - {name: sanitizers, cc: gcc, flags: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Test BE flank quotas and native eigensolver
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          FLAGS: ${{ matrix.flags }}
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          OMP_NUM_THREADS: "4"
        run: |
          set -euo pipefail
          "$CC" -std=c99 $FLAGS -Iinclude test/test_krylov_be_lock_order.c -lm -o lock_side
          ./lock_side
          for t in both_ends modes unified api_contract; do
            "$CC" -std=c99 $FLAGS -Iinclude src/esolver/lis_krylov.c "test/test_krylov_$t.c" -lm -o "test_$t"
            "./test_$t" > "out_$t.log"
            tail -n 1 "out_$t.log"
          done
  autotools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libtool libtool-bin gfortran
      - name: Existing full tracked build and focused tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir build && cd build
          ../configure --enable-omp
          make -j2
          make -C test test_krylov_both_ends test_krylov_unified
          make -C test check-TESTS TESTS='test_krylov_both_ends'
          ./test/test_krylov_unified
