name: Benchmark RCO vs CSR assembly

on:
  pull_request:
    paths:
      - 'test/bench_rco_csr.c'
      - 'test/Makefile.am'
      - '.github/workflows/rco-csr-benchmark.yml'
  push:
    branches:
      - 'perf/benchmark-rco-csr-*'
    paths:
      - 'test/bench_rco_csr.c'
      - 'test/Makefile.am'
      - '.github/workflows/rco-csr-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin pkg-config gfortran
      - name: Configure and compile
        run: |
          autoreconf -fiv
          mkdir build-bench
          cd build-bench
          ../configure
          make -j2
          make -C test bench_rco_csr
      - name: Validate output and record assembly timings
        run: |
          ./build-bench/test/bench_rco_csr 48 2
          ./build-bench/test/bench_rco_csr 128 3
