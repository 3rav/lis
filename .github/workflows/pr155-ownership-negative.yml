name: PR155 ownership negative control (expected regression)
on:
  push:
    branches: [validation/pr155-ownership-negative]
  workflow_dispatch:
jobs:
  expected-failure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: serial, configure: '', threads: 1}
          - {label: openmp-4, configure: '--enable-omp', threads: 4}
    name: negative-control-${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin pkg-config gfortran
      - name: Build unpatched PR HEAD with new regression test
        run: |
          autoreconf -fiv
          mkdir build
          cd build
          ../configure ${{ matrix.configure }}
          make -j2
          make -C test testmatrixmaterializeomp
      - name: Assert test FAILS due to expected missing ownership
        env:
          OMP_NUM_THREADS: ${{ matrix.threads }}
          OMP_DYNAMIC: 'FALSE'
        run: |
          cd build
          set +e
          ./test/testmatrixmaterializeomp > ownership-negative-control.log 2>&1
          rc=$?
          set -e
          cat ownership-negative-control.log
          if [ "$rc" -eq 0 ]; then
            echo "Unexpected success: ownership regression was not detected"
            exit 1
          fi
          grep -q 'cached CSR did not retain ownership of its buffers' ownership-negative-control.log
          echo "EXPECTED FAILURE CONFIRMED: unpatched code fails ownership regression"
