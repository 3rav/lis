name: LIS MPI distributed smoke validation
on:
  push:
    branches: [validation/mpi-smoke-pr4-20261031]
  workflow_dispatch:
jobs:
  mpi-smoke:
    name: MPI distributed ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: real, opts: "" }
          - { mode: complex, opts: "--enable-complex" }
    env:
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
      OMPI_MCA_rmaps_base_oversubscribe: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin gfortran libopenmpi-dev openmpi-bin
      - name: Build MPI with ASan and UBSan
        run: |
          autoreconf -fiv
          mkdir build && cd build
          CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" \
          LDFLAGS="-fsanitize=address,undefined" MPICC=mpicc MPIRUN=mpirun MPINP=-np \
            ../configure --enable-mpi ${{ matrix.opts }}
          grep -q -- '-DUSE_MPI' Makefile
          make -j2
      - name: Run distributed MPI smoke with timeouts
        run: |
          cd build
          set -euo pipefail
          for np in 2 4; do
            for binary in testvectornrm2mpi testmatrixoperatormpi; do
              echo "START ranks=$np test=$binary"
              timeout 45s mpirun --oversubscribe -np "$np" "./test/$binary" 2>&1 | tee -a mpi-smoke.log
              echo "PASS ranks=$np test=$binary"
            done
          done
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpi-smoke-${{ matrix.mode }}
          path: build/mpi-smoke.log
          if-no-files-found: ignore
