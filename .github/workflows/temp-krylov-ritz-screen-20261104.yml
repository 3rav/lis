name: Temporary conservative Ritz screening evaluation

on:
  push:
    branches: [exp/krylov-standard-ritz-prefilter-20261104]

jobs:
  comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Compare callback and full-vector numerical parity
        shell: bash
        run: |
          set -euo pipefail
          git show 1e1347382d09158d4bb019b00f1d9622534e8475:src/esolver/lis_krylov.c > original.c
          gcc -O2 -std=c99 -DKRYLOV_BASELINE_COMPARISON -Iinclude original.c test/bench_krylov_ritz_screen.c -lm -o baseline
          gcc -O2 -std=c99 -DKRYLOV_BASELINE_COMPARISON -Iinclude src/esolver/lis_krylov.c test/bench_krylov_ritz_screen.c -lm -o candidate
          ./baseline > before.log
          ./candidate > after.log
          python3 - <<'PY'
          import math
          old=open("before.log").read().splitlines()
          new=open("after.log").read().splitlines()
          assert len(old)==len(new)
          saved=0; improved=0; cases=0
          for x,y in zip(old,new):
              a=x.split(); b=y.split()
              assert a[0]==b[0],(x,y)
              if a[0]=="CASE":
                  cases+=1
                  assert a[:14]==b[:14],(x,y)
                  assert len(a)==len(b)
                  assert a[15:17]==b[15:17],(x,y)
                  for i in range(17,len(a)):
                      assert math.isclose(float(a[i]),float(b[i]),rel_tol=1e-10,abs_tol=1e-12),(x,y)
                  delta=int(a[14])-int(b[14])
                  assert delta>=0,(x,y)
                  if a[1]!="0" or a[2]!="1" or a[3]!="1":
                      assert delta==0,(x,y)
                  saved+=delta
                  if delta: improved+=1
              elif a[0]=="VECTOR":
                  assert len(a)==len(b)
                  for u,v in zip(a[1:],b[1:]):
                      assert math.isclose(float(u),float(v),rel_tol=1e-10,abs_tol=1e-12),(u,v)
              else: assert x==y,(x,y)
          assert cases==96,cases
          print("PASS", cases, "cases: full numerical and vector parity")
          print("SAVED APPLY A",saved,"IMPROVED CASES",improved)
          PY
  numerical:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: gcc, cc: gcc, flags: "-O2"}
          - {name: clang, cc: clang, flags: "-O2"}
          - {name: openmp, cc: gcc, flags: "-O2 -fopenmp"}
          - {name: sanitizers, cc: gcc, flags: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Run numerical regression suite
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          FLAGS: ${{ matrix.flags }}
          ASAN_OPTIONS: 'detect_leaks=1:halt_on_error=1'
          UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
          OMP_NUM_THREADS: '4'
        run: |
          set -euo pipefail
          for test in modes regression sparse semidefinite stress inertia window openmp projected workspace unified adaptive_ex api_contract; do
            "$CC" -std=c99 $FLAGS -Iinclude src/esolver/lis_krylov.c "test/test_krylov_${test}.c" -lm -o "run_${test}"
            "./run_${test}" > "/tmp/${test}.log"
            tail -n 2 "/tmp/${test}.log"
          done
