name: Fair-fill serial ILUT vs RAS convergence benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/ras-schur-scalable
    paths:
      - .github/workflows/ras-fair-fill.yml

permissions:
  contents: read

jobs:
  bcsstk39:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '8'
      OMP_DYNAMIC: 'FALSE'
      LIS_FEA_BASELINE_THREADS: '1'
      LIS_FEA_BASELINE_RCM: '0'
      LIS_FEA_SKIP_SCHUR: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin unzip
      - name: Compile LIS and numerical benchmark
        run: |
          autoreconf -fiv
          ./configure --enable-test --enable-omp --disable-fortran --disable-f90 \
            --disable-saamg --disable-mpi
          make -j2
          make -C test testhalfilut
      - name: Download and identify Boeing bcsstk39 structural stiffness matrix
        run: |
          set -euo pipefail
          mkdir -p fair-fill
          curl --fail --location --retry 3 --max-time 180 \
            https://nrvis.com/download/data/misc/bcsstk39.zip \
            -o fair-fill/bcsstk39.zip
          unzip -o -q fair-fill/bcsstk39.zip -d fair-fill
          find fair-fill -type f -iname '*.mtx' -exec chmod u+r {} +
          mtx="$(find fair-fill -type f -iname '*.mtx' | head -1)"
          test -n "$mtx"
          head -n 1 "$mtx" | grep -qiE '^%%MatrixMarket matrix coordinate real'
          printf '%s\n' "$mtx" > fair-fill/matrix.txt
      - name: RAS fill-rate sweep against converged one-thread ILUT baseline
        run: |
          set -uo pipefail
          set +e
          matrix="$(cat fair-fill/matrix.txt)"
          # Controlled reference: 1-thread global ILUT, rate=16, drop=1e-4,
          # row_scale=1, no RCM. Reference known to converge at 84 FGMRES
          # iterations on this fixed input. For each tested RAS rate, use
          # 8-domain overlap=1, local RCM=1, OMP_NUM_THREADS=8.
          for ras_rate in 12 16 20; do
            log="fair-fill/ras-rate-${ras_rate}.log"
            echo "### serial baseline rate=16 vs RAS rate=$ras_rate" | tee "$log"
            timeout 600 ./test/testhalfilut --fea-ras \
              "$matrix" 16 "$ras_rate" 8 0.0001 8 1 0 1 1 1 \
              >> "$log" 2>&1
            rc=$?
            cat "$log"
            printf '%s\n' "$rc" > "fair-fill/ras-rate-${ras_rate}.status"
            echo "benchmark_exit_status=$rc"
          done
          set -e
          for ras_rate in 12 16 20; do
            log="fair-fill/ras-rate-${ras_rate}.log"
            grep -q '^baseline,' "$log"
            grep -q '^ras,' "$log"
          done
      - name: Upload full evidence, preserving nonconvergence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fair-fill-1thread-ILUT-versus-8domain-RAS
          path: |
            fair-fill/ras-rate-*.log
            fair-fill/ras-rate-*.status
            fair-fill/matrix.txt
          if-no-files-found: warn
