name: Temporary native Krylov residual cache review

on:
  push:
    branches: [work/krylov-179-review-20261104]

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare unmodified develop and optimized core
        shell: bash
        run: |
          set -euo pipefail
          git show 1e1347382d09158d4bb019b00f1d9622534e8475:src/esolver/lis_krylov.c > original.c
          gcc -std=c99 -O2 -DKRYLOV_BASELINE_COMPARISON -Iinclude original.c test/test_krylov_residual_reuse.c -lm -o before
          gcc -std=c99 -O2 -Iinclude src/esolver/lis_krylov.c test/test_krylov_residual_reuse.c -lm -o after
          ./before > baseline.log
          ./after > optimized.log
          python3 - <<'PY'
          from math import isclose
          a = open("baseline.log").read().splitlines()
          b = open("optimized.log").read().splitlines()
          assert len(a) == len(b), (len(a),len(b))
          saved_a = saved_b = improved = cases = 0
          max_base = {}
          max_new = {}
          for old,new in zip(a,b):
              x,y=old.split(),new.split()
              assert x[0] == y[0], (old,new)
              if x[0] == "CASE":
                  cases += 1
                  assert x[:14] == y[:14], (old,new)
                  assert x[16] == y[16], (old,new)
                  assert len(x) == len(y)
                  for u,v in zip(x[17:],y[17:]):
                      assert isclose(float(u),float(v),rel_tol=1e-11,abs_tol=2e-12), (old,new)
                  da = int(x[14])-int(y[14])
                  db = int(x[15])-int(y[15])
                  assert da >= 0 and db >= 0, (old,new)
                  if x[2] == "0": assert da == db == 0, (old,new)
                  if da or db: improved += 1
                  saved_a += da
                  saved_b += db
                  key = tuple(map(int,x[1:7]))
                  max_base[key] = (int(x[14]),int(x[15]))
                  max_new[key] = (int(y[14]),int(y[15]))
              elif x[0] == "VECTOR":
                  assert len(x) == len(y)
                  for u,v in zip(x[1:],y[1:]):
                      assert isclose(float(u),float(v),rel_tol=2e-11,abs_tol=2e-12), (u,v)
              else:
                  assert old == new, (old,new)
          assert cases >= 72 and improved > 0 and saved_a > 0, (cases,improved,saved_a)
          print("PASS",cases,"cases: status, counts, values, full eigenvectors and residuals match")
          print("SAVED A",saved_a,"B",saved_b,"improved cases",improved)
          for key in sorted(max_new):
              if key[1] and key[2] and key[3] and key[4]==0:
                  print("BUDGET",key,"baseline",max_base[key],"optimized",max_new[key])
          PY

  numerical:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: gcc, cc: gcc, flags: "-O2"}
          - {name: clang, cc: clang, flags: "-O2"}
          - {name: openmp, cc: gcc, flags: "-O2 -fopenmp"}
          - {name: sanitizers, cc: gcc, flags: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Run native numerical regression suite
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          FLAGS: ${{ matrix.flags }}
          OMP_NUM_THREADS: "4"
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          set -euo pipefail
          for test in residual_reuse modes regression sparse semidefinite stress inertia window openmp projected workspace unified adaptive_ex api_contract; do
            "$CC" -std=c99 $FLAGS -Iinclude src/esolver/lis_krylov.c "test/test_krylov_${test}.c" -lm -o "test_${test}"
            "./test_${test}" > "/tmp/result_${test}.log"
            tail -n 2 "/tmp/result_${test}.log"
          done

  autotools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin gfortran
      - name: Full project build, standalone and adapter regressions
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          git diff --stat test/Makefile.in
          git diff -U0 -- test/Makefile.in | tail -n 140
          mkdir build && cd build
          ../configure --enable-omp
          make -j2
          make -C test test_krylov_residual_reuse test_krylov_api_contract test_krylov_lis test_krylov_unified
          ./test/test_krylov_residual_reuse > /tmp/fixture.log
          tail -n 2 /tmp/fixture.log
          ./test/test_krylov_api_contract
          ./test/test_krylov_lis
          ./test/test_krylov_unified

  tracked-makefile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install binary dependencies only
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool libtool-bin gfortran
      - name: Build without regenerating Makefile.in and run installed test
        shell: bash
        run: |
          set -euo pipefail
          mkdir build && cd build
          ../configure --enable-omp
          make -j2
          make -C test test_krylov_residual_reuse
          make -C test check-TESTS TESTS=test_krylov_residual_reuse
          ./test/test_krylov_residual_reuse > /tmp/fixture.log
          tail -n 2 /tmp/fixture.log
