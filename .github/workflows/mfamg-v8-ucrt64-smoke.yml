name: MFAMG v8 UCRT64 smoke
on:
  pull_request:
    branches:
      - experiment/mfamg-modes-snapshot-v7-20261108
  push:
    branches:
      - experiment/mfamg-fgcrodr-replay-v8-20261108
  workflow_dispatch:

jobs:
  build-and-replay:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Preserve LF in checked-out Autotools sources
        shell: pwsh
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            make
            git
            file
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
      - name: Autotools configure and build
        run: |
          set -euxo pipefail
          bash -n test/mfamg_replay_fgcrodr_sweep.sh
          bash -n test/mfamg_replay_v8_report_smoke.sh
          bash test/mfamg_replay_v8_report_smoke.sh
          bash -n test/mfamg_replay_v8_sweep_smoke.sh
          bash test/mfamg_replay_v8_sweep_smoke.sh
          bash -n test/mfamg_replay_indefinite_ci.sh
          bash -n test/mfamg_replay_illconditioned_ci.sh
          autoreconf -fiv
          mkdir -p build-ci
          cd build-ci
          ../configure --prefix=/ucrt64 \
            --enable-omp --enable-shared --disable-longlong \
            --enable-half --disable-longdouble --enable-quad \
            --disable-complex --disable-mpi --disable-test --with-gnu-ld
          make -j2
          make -C test mfamgreplay.exe testmfamgmodes.exe testmfamgv8maxiter.exe
          file test/.libs/mfamgreplay.exe
          test -s test/.libs/mfamgreplay.exe
          ./test/testmfamgmodes.exe
          ./test/testmfamgv8maxiter.exe
      - name: Check opt-in extended replay iteration limit (no contact data)
        run: |
          set -euo pipefail
          exe="$PWD/build-ci/test/.libs/mfamgreplay.exe"
          if LIS_MFAMG_REPLAY_MAXITER=6001 "$exe" missing-A.mtx missing-b.mtx missing-modes.mtx > build-ci/maxiter_rejected.log 2>&1; then
            echo "ERROR: 6001-iteration request was accepted" >&2
            exit 1
          fi
          grep -q 'invalid LIS_MFAMG_REPLAY_MAXITER=6001 (expected integer 100..6000)' build-ci/maxiter_rejected.log
          # Reaching file I/O demonstrates that 6000 passed replay option parsing.
          if LIS_MFAMG_REPLAY_MAXITER=6000 "$exe" missing-A.mtx missing-b.mtx missing-modes.mtx > build-ci/maxiter_accepted.log 2>&1; then
            echo "ERROR: missing input files were unexpectedly accepted" >&2
            exit 1
          fi
          if grep -q 'invalid LIS_MFAMG_REPLAY_MAXITER=' build-ci/maxiter_accepted.log; then
            echo "ERROR: the 6000-iteration option was incorrectly rejected" >&2
            exit 1
          fi
          echo "EXTENDED_MAXITER_OPTION_OK"
      - name: Generate a 240-row reproducible Matrix Market smoke system
        run: |
          set -euxo pipefail
          mkdir -p build-ci/smoke
          cd build-ci/smoke
          {
            echo '%%MatrixMarket matrix coordinate real general'
            echo '240 240 718'
            for ((i=1;i<=240;i++)); do
              echo "$i $i 4"
              if (( i>1 )); then echo "$i $((i-1)) -1"; fi
              if (( i<240 )); then echo "$i $((i+1)) -1"; fi
            done
          } > A.mtx
          {
            echo '%%MatrixMarket matrix array real general'
            echo '240 1'
            for ((i=1;i<=240;i++)); do echo 1; done
          } > b.mtx
          {
            echo '%%MatrixMarket matrix array real general'
            echo '240 2'
            for ((i=1;i<=240;i++)); do echo 1; done
            for ((i=1;i<=240;i++)); do
              awk -v i="$i" 'BEGIN { printf "%.17g\n", (i-120.5)/240 }'
            done
          } > modes.mtx
      - name: Compare default FGMRES and FGCRO-DR on identical matrix
        run: |
          set -euxo pipefail
          cd build-ci/smoke
          export LIS_MFAMG_EXPERIMENT_FINE_AGG=1
          export LIS_MFAMG_FINE_AGG_FACTOR=2
          export LIS_MFAMG_EXPERIMENT_DEEP_MERGE=1
          export LIS_MFAMG_VCYCLE_SMOOTH_STEPS=3
          export LIS_FGMRES_PROJECTED_RELATIVE=1
          exe=../test/.libs/mfamgreplay.exe
          LIS_MFAMG_REPLAY_METHOD=fgmres \
            "$exe" A.mtx b.mtx modes.mtx > fgmres.log 2>&1
          cat fgmres.log
          grep -q 'method=fgmres recycle_k=0' fgmres.log
          grep -q 'REPLAY_RESULT solve_rc=0 status=0 ' fgmres.log
          LIS_MFAMG_REPLAY_METHOD=fgcrodr LIS_MFAMG_REPLAY_RECYCLE_DIM=8 \
            "$exe" A.mtx b.mtx modes.mtx > fgcrodr.log 2>&1
          cat fgcrodr.log
          grep -q 'method=fgcrodr recycle_k=8' fgcrodr.log
          grep -q 'REPLAY_RESULT solve_rc=0 status=0 ' fgcrodr.log
          grep -q '^REPLAY_RECYCLE ' fgcrodr.log
      - name: Exercise within-solve recycling after a forced Arnoldi restart
        run: |
          set -euo pipefail
          cd build-ci/smoke
          {
            echo '%%MatrixMarket matrix array real general'
            echo '240 1'
            for ((i=1;i<=240;i++)); do
              echo "$(( (i*37)%23 - 11 ))"
            done
          } > b_hard.mtx
          export LIS_MFAMG_EXPERIMENT_FINE_AGG=1
          export LIS_MFAMG_FINE_AGG_FACTOR=2
          export LIS_MFAMG_EXPERIMENT_DEEP_MERGE=1
          export LIS_MFAMG_VCYCLE_SMOOTH_STEPS=1
          export LIS_MFAMG_REPLAY_RESTART=2
          export LIS_MFAMG_REPLAY_MAXITER=100
          export LIS_FGMRES_PROJECTED_RELATIVE=1
          exe=../test/.libs/mfamgreplay.exe
          set +e
          LIS_MFAMG_REPLAY_METHOD=fgmres \
            "$exe" A.mtx b_hard.mtx modes.mtx > hard_fgmres.log 2>&1
          fgmres_rc=$?
          LIS_MFAMG_REPLAY_METHOD=fgcrodr LIS_MFAMG_REPLAY_RECYCLE_DIM=0 \
            "$exe" A.mtx b_hard.mtx modes.mtx > hard_fgcrodr_k0.log 2>&1
          zero_rc=$?
          LIS_MFAMG_REPLAY_METHOD=fgcrodr LIS_MFAMG_REPLAY_RECYCLE_DIM=1 \
            "$exe" A.mtx b_hard.mtx modes.mtx > hard_fgcrodr_no_intra.log 2>&1
          old_rc=$?
          LIS_MFAMG_REPLAY_METHOD=fgcrodr LIS_MFAMG_REPLAY_RECYCLE_DIM=1 \
          LIS_FGCRODR_INTRA_SOLVE_RECYCLE=1 LIS_FGCRODR_INTRA_TRACE=1 \
          LIS_MFAMG_REPLAY_VALIDATE_RECYCLE=1 \
            "$exe" A.mtx b_hard.mtx modes.mtx > hard_fgcrodr_intra.log 2>&1
          intra_rc=$?
          set -e
          echo "exit codes: fgmres=$fgmres_rc k0=$zero_rc legacy=$old_rc intra=$intra_rc"
          test "$fgmres_rc" -eq "$zero_rc"
          # Verify at least one restart was needed by the FGMRES control.
          awk '/^REPLAY_RESULT / {for(i=1;i<=NF;i++)
                 if($i ~ /^iter=/) {split($i,p,"="); if(p[2]<=2) exit 1}}' hard_fgmres.log
          # k=0 is a bitwise numerical fallback to the existing FGMRES.
          extract_result() {
            grep '^REPLAY_RESULT ' "$1" | sed -E 's/^.*status=([^ ]+) iter=([^ ]+) reported_residual=([^ ]+) true_relative=([^ ]+) wall_seconds=.*$/\1 \2 \3 \4/'
          }
          test "$(extract_result hard_fgmres.log)" = "$(extract_result hard_fgcrodr_k0.log)"
          for log in hard_fgmres.log hard_fgcrodr_k0.log hard_fgcrodr_no_intra.log hard_fgcrodr_intra.log; do
            echo "==== $log ===="
            grep -E '^REPLAY n=|^REPLAY_RECYCLE|^REPLAY_RESULT|^REPLAY LIS error|^LIS_FGCRODR_INTRA_RECYCLE ' "$log" || true
            grep -q '^REPLAY_RESULT ' "$log"
            if grep -qiE 'nan|[+-]inf' "$log"; then
              echo "ERROR: nonfinite text in $log" >&2
              exit 1
            fi
          done
          # Key requirement: the newly built space must be actively used
          # at the next cycle, not simply built at the end of a solve.
          grep -q '^LIS_FGCRODR_INTRA_RECYCLE iter=' hard_fgcrodr_intra.log
          ! grep -q '^LIS_FGCRODR_INTRA_RECYCLE iter=' hard_fgcrodr_no_intra.log
          grep -q 'method=fgcrodr recycle_k=1' hard_fgcrodr_intra.log
          grep -q '^REPLAY_RECYCLE_STATS .*uses=1 ' hard_fgcrodr_intra.log
          grep -q '^REPLAY_RECYCLE_CHECK rc=0 ' hard_fgcrodr_intra.log
          grep -q '^REPLAY_RESULT solve_rc=0 status=0 ' hard_fgcrodr_intra.log
          test "$intra_rc" -eq 0
      - name: Test changed operator A1 to A2 with the SAME solver and MFAMG modes
        run: |
          set -euo pipefail
          cd build-ci/smoke
          {
            echo '%%MatrixMarket matrix coordinate real general'
            echo '240 240 718'
            for ((i=1;i<=240;i++)); do
              echo "$i $i 5"
              if (( i>1 )); then echo "$i $((i-1)) -1"; fi
              if (( i<240 )); then echo "$i $((i+1)) -1"; fi
            done
          } > A_newton2.mtx
          {
            echo '%%MatrixMarket matrix array real general'
            echo '240 1'
            for ((i=1;i<=240;i++)); do
              echo "$(( (i*29)%19 - 9 ))"
            done
          } > b_newton2.mtx
          # Independent third synthetic operator: same graph, changed
          # diagonal AND both off-diagonal coefficients.
          {
            echo '%%MatrixMarket matrix coordinate real general'
            echo '240 240 718'
            for ((i=1;i<=240;i++)); do
              echo "$i $i 6"
              if (( i>1 )); then echo "$i $((i-1)) -0.9"; fi
              if (( i<240 )); then echo "$i $((i+1)) -1.1"; fi
            done
          } > A_newton3.mtx
          {
            echo '%%MatrixMarket matrix coordinate real general'
            echo '240 240 718'
            for ((i=1;i<=240;i++)); do
              echo "$i $i 6"
              if (( i>1 )); then echo "$i $((i-1)) -0.9"; fi
              if (( i<240 )); then
                if (( i==1 )); then
                  echo '1 3 -1.1'
                else
                  echo "$i $((i+1)) -1.1"
                fi
              fi
            done
          } > A_newton3_changed_graph.mtx
          {
            echo '%%MatrixMarket matrix array real general'
            echo '240 1'
            for ((i=1;i<=240;i++)); do
              echo "$(( (i*31)%17 - 8 ))"
            done
          } > b_newton3.mtx
          exe=../test/.libs/mfamgreplay.exe
          "$exe" --compare-csr A.mtx A_newton2.mtx > csr_preflight_ok.log 2>&1
          grep -q '^REPLAY_CSR_COMPARE compatible=1 n=240 nnz=718 changed_nnz=240$' csr_preflight_ok.log
          if "$exe" --compare-csr A.mtx A.mtx > csr_preflight_unchanged.log 2>&1; then
            echo 'ERROR: unchanged A was accepted as changed by CSR preflight' >&2
            exit 1
          fi
          grep -q '^REPLAY_CSR_COMPARE compatible=0$' csr_preflight_unchanged.log
          export LIS_MFAMG_EXPERIMENT_FINE_AGG=1
          export LIS_MFAMG_FINE_AGG_FACTOR=2
          export LIS_MFAMG_EXPERIMENT_DEEP_MERGE=1
          export LIS_MFAMG_VCYCLE_SMOOTH_STEPS=1
          export LIS_MFAMG_REPLAY_RESTART=2
          export LIS_MFAMG_REPLAY_MAXITER=100
          export LIS_FGMRES_PROJECTED_RELATIVE=1
          export LIS_MFAMG_REPLAY_METHOD=fgcrodr
          export LIS_MFAMG_REPLAY_RECYCLE_DIM=1
          export LIS_FGCRODR_INTRA_SOLVE_RECYCLE=1
          export LIS_MFAMG_REPLAY_VALIDATE_RECYCLE=1
          exe=../test/.libs/mfamgreplay.exe
          export LIS_MFAMG_REPLAY_NEXT_A=A_newton2.mtx
          export LIS_MFAMG_REPLAY_NEXT_B=b_newton2.mtx
          "$exe" A.mtx b_hard.mtx modes.mtx > newton_same_solver.log 2>&1
          grep -q '^REPLAY_RESULT solve_rc=0 status=0 ' newton_same_solver.log
          grep -q '^REPLAY_NEWTON_STEP step=2 n=240 ' newton_same_solver.log
          grep -q '^REPLAY_NEWTON_RECYCLE_CHECK rc=0 ' newton_same_solver.log
          grep -q '^REPLAY_NEWTON_RESULT step=2 solve_rc=0 status=0 ' newton_same_solver.log
          # A2 is a distinct matrix object: old recycle space MUST
          # be rejected rather than quietly reused with stale A1*Z.
          grep -q '^REPLAY_NEWTON_MATRIX mode=separate_object' newton_same_solver.log
          grep -Eq '^REPLAY_NEWTON_POLICY cross_uses_delta=0 keeps_delta=0 transports_delta=0 rejects_delta=[1-9][0-9]*$' newton_same_solver.log
          # Positive control: same matrix object, same sparsity pattern,
          # but explicitly changed value_generation. This must exercise
          # KEEP or TRANSPORT (real cross-operator Z reuse).
          LIS_MFAMG_REPLAY_NEXT_DIAG_SHIFT=-1 \
            "$exe" A.mtx b_hard.mtx modes.mtx > newton_inplace_solver.log 2>&1
          grep -q '^REPLAY_NEWTON_MATRIX mode=inplace_diag_shift shift=-1' newton_inplace_solver.log
          grep -q '^REPLAY_NEWTON_RECYCLE_CHECK rc=0 ' newton_inplace_solver.log
          grep -q '^REPLAY_NEWTON_RESULT step=2 solve_rc=0 status=0 ' newton_inplace_solver.log
          grep -Eq '^REPLAY_NEWTON_POLICY cross_uses_delta=[1-9][0-9]* ' newton_inplace_solver.log
          # Control for graph-compatible A2 value replacement.
          LIS_MFAMG_REPLAY_NEXT_REPLACE_VALUES=1 \
            "$exe" A.mtx b_hard.mtx modes.mtx > newton_replaced_solver.log 2>&1
          grep -Eq '^REPLAY_NEWTON_MATRIX mode=inplace_replace_values changed_nnz=[1-9][0-9]*$' newton_replaced_solver.log
          grep -Eq '^REPLAY_NEWTON_POLICY cross_uses_delta=[1-9][0-9]* ' newton_replaced_solver.log
          grep -q '^REPLAY_NEWTON_RECYCLE_CHECK rc=0 ' newton_replaced_solver.log
          grep -q '^REPLAY_NEWTON_RESULT step=2 solve_rc=0 status=0 ' newton_replaced_solver.log
          # Step3 uses the SAME solver object as both A1 and A2.
          # First path: second-step A5, then third-step A6 with
          # same CSR graph; require actual cross-system reuse.
          LIS_MFAMG_REPLAY_NEXT_DIAG_SHIFT=-1 \
          LIS_MFAMG_REPLAY_THIRD_A=A_newton3.mtx \
          LIS_MFAMG_REPLAY_THIRD_B=b_newton3.mtx \
          LIS_MFAMG_REPLAY_THIRD_REPLACE_VALUES=1 \
            "$exe" A.mtx b_hard.mtx modes.mtx > newton_three_keep.log 2>&1
          grep -q '^REPLAY_SEQUENCE_MATRIX step=3 mode=inplace_replace_values ' newton_three_keep.log
          grep -q '^REPLAY_SEQUENCE_RECYCLE_CHECK step=3 rc=0 ' newton_three_keep.log
          grep -q '^REPLAY_SEQUENCE_RESULT step=3 solve_rc=0 status=0 ' newton_three_keep.log
          grep -Eq '^REPLAY_SEQUENCE_POLICY step=3 cross_uses_delta=[1-9][0-9]* ' newton_three_keep.log
          # Second path: changed graph must force REJECT.
          LIS_MFAMG_REPLAY_NEXT_DIAG_SHIFT=-1 \
          LIS_MFAMG_REPLAY_THIRD_A=A_newton3_changed_graph.mtx \
          LIS_MFAMG_REPLAY_THIRD_B=b_newton3.mtx \
            "$exe" A.mtx b_hard.mtx modes.mtx > newton_three_reject.log 2>&1
          grep -q '^REPLAY_SEQUENCE_MATRIX step=3 mode=separate_object' newton_three_reject.log
          grep -q '^REPLAY_SEQUENCE_RECYCLE_CHECK step=3 rc=0 ' newton_three_reject.log
          grep -q '^REPLAY_SEQUENCE_RESULT step=3 solve_rc=0 status=0 ' newton_three_reject.log
          grep -Eq '^REPLAY_SEQUENCE_POLICY step=3 cross_uses_delta=0 keeps_delta=0 transports_delta=0 rejects_delta=[1-9][0-9]*$' newton_three_reject.log
          unset LIS_MFAMG_REPLAY_NEXT_A LIS_MFAMG_REPLAY_NEXT_B
          "$exe" A_newton2.mtx b_newton2.mtx modes.mtx > newton_fresh_solver.log 2>&1
          grep -q '^REPLAY_RESULT solve_rc=0 status=0 ' newton_fresh_solver.log
          "$exe" A_newton3.mtx b_newton3.mtx modes.mtx > newton_fresh_third.log 2>&1
          grep -q '^REPLAY_RESULT solve_rc=0 status=0 ' newton_fresh_third.log
          # Avoid relying on Python in the Windows UCRT64 runner.
          for entry in "newton_same_solver.log:REPLAY_NEWTON_RESULT" \
                       "newton_inplace_solver.log:REPLAY_NEWTON_RESULT" \
                       "newton_replaced_solver.log:REPLAY_NEWTON_RESULT" \
                       "newton_three_keep.log:REPLAY_SEQUENCE_RESULT" \
                       "newton_three_reject.log:REPLAY_SEQUENCE_RESULT" \
                       "newton_fresh_third.log:REPLAY_RESULT" \
                       "newton_fresh_solver.log:REPLAY_RESULT"; do
            log="${entry%%:*}"
            marker="${entry#*:}"
            awk -v wanted="$marker" '
              $1==wanted {
                count++
                for (i=2;i<=NF;i++) if ($i ~ /^true_relative=/) {
                  split($i,v,"=")
                  if ((v[2]+0) > 1e-5 || (v[2]+0) < 0) bad=1
                  found++
                }
              }
              END { if(count!=1 || found!=1 || bad) exit 1 }
            ' "$log"
          done
          echo MFAMG_V8_CHANGED_OPERATOR_SAME_SOLVER_OK
          if LIS_MFAMG_REPLAY_NEXT_A=A_newton2.mtx "$exe" A.mtx b_hard.mtx modes.mtx \
                > newton_missing_rhs.log 2>&1; then
            echo 'ERROR: incomplete A2/B2 input was accepted' >&2
            exit 1
          fi
          grep -q 'specify both NEXT_A and NEXT_B' newton_missing_rhs.log
          if LIS_MFAMG_REPLAY_NEXT_DIAG_SHIFT=-1 \
                "$exe" A.mtx b_hard.mtx modes.mtx > newton_shift_without_A2.log 2>&1; then
            echo 'ERROR: diagonal shift without A2/b2 was accepted' >&2
            exit 1
          fi
          grep -q 'diagonal shift requires NEXT_A and NEXT_B' newton_shift_without_A2.log
          # Step 1 may succeed but any step-2 I/O failure must still fail.
          if LIS_MFAMG_REPLAY_NEXT_A=A_newton2.mtx \
             LIS_MFAMG_REPLAY_NEXT_B=nonexistent-step2-RHS.mtx \
             "$exe" A.mtx b_hard.mtx modes.mtx > newton_bad_rhs.log 2>&1; then
            echo 'ERROR: missing second RHS produced a successful exit' >&2
            exit 1
          fi
          grep -q '^REPLAY_RESULT solve_rc=0 status=0 ' newton_bad_rhs.log
          {
            echo '%%MatrixMarket matrix coordinate real general'
            echo '3 3 3'
            for ((i=1;i<=3;i++)); do echo "$i $i 4"; done
          } > A_wrong_size.mtx
          if LIS_MFAMG_REPLAY_NEXT_A=A_wrong_size.mtx \
             LIS_MFAMG_REPLAY_NEXT_B=b_newton2.mtx \
             "$exe" A.mtx b_hard.mtx modes.mtx > newton_bad_shape.log 2>&1; then
            echo 'ERROR: incompatible second operator was accepted' >&2
            exit 1
          fi
          grep -q 'operator dimensions/distribution changed' newton_bad_shape.log
      - name: Publish experimental UCRT64 mfamgreplay EXE
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mfamg-v8-replay-ucrt64-experimental
          path: build-ci/test/.libs/mfamgreplay.exe
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Check symmetric-indefinite 480-row recycling
        run: |
          set -euo pipefail
          bash test/mfamg_replay_indefinite_ci.sh \
            "$PWD/build-ci/test/.libs/mfamgreplay.exe" \
            "$PWD/build-ci/smoke"
      - name: Check ill-conditioned indefinite 480-row recycling
        run: |
          set -euo pipefail
          bash test/mfamg_replay_illconditioned_ci.sh \
            "$PWD/build-ci/test/.libs/mfamgreplay.exe" \
            "$PWD/build-ci/smoke"
      - name: Upload smoke logs even when failing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfamg-v8-smoke-logs
          path: build-ci/smoke/*.log
          if-no-files-found: ignore

  mode-audit-smoke:
    name: Offline mode audit (no private data)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Matrix Market spectral audit on a synthetic system
        run: |
          python3 -m py_compile test/mfamg_mode_audit.py
          bash -n test/mfamg_mode_audit_smoke.sh
          bash test/mfamg_mode_audit_smoke.sh
          python3 -m py_compile test/mfamg_mode_ritz_selection.py
          bash -n test/mfamg_mode_ritz_selection_smoke.sh
          bash test/mfamg_mode_ritz_selection_smoke.sh
          python3 -m py_compile test/mfamg_mode_ritz_leave_one_out.py
          bash -n test/mfamg_mode_ritz_leave_one_out_smoke.sh
          bash -n test/mfamg_replay_ritz_leave_one_out.sh
          bash test/mfamg_mode_ritz_leave_one_out_smoke.sh
          python3 -m py_compile test/mfamg_replay_v8_repeats.py
          bash -n test/mfamg_replay_v8_repeats_smoke.sh
          bash test/mfamg_replay_v8_repeats_smoke.sh
          python3 -m py_compile test/mfamg_v8_solver_pair_compare.py
          bash -n test/mfamg_v8_solver_pair_compare_smoke.sh
          bash test/mfamg_v8_solver_pair_compare_smoke.sh
          python3 -m py_compile test/mfamg_mode_auto_candidates.py
          bash -n test/mfamg_mode_auto_candidates_smoke.sh
          bash test/mfamg_mode_auto_candidates_smoke.sh
          python3 -m py_compile test/mfamg_replay_v8_candidate_compare.py
          bash -n test/mfamg_replay_v8_candidate_compare_smoke.sh
          bash test/mfamg_replay_v8_candidate_compare_smoke.sh
          python3 -m py_compile test/mfamg_v8_snapshot_sequence.py
          python3 -m py_compile test/mfamg_v8_triplet_windows.py
          bash -n test/mfamg_v8_snapshot_sequence_smoke.sh
          bash test/mfamg_v8_snapshot_sequence_smoke.sh

  linux-operator-transport:
    name: Linux C replay A1/A2 transport (synthetic only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build real-valued serial LIS and experimental replay
        run: |
          set -euxo pipefail
          autoreconf -fiv
          mkdir -p build-linux
          cd build-linux
          ../configure --enable-shared --disable-complex --disable-mpi --disable-test \
            CFLAGS="-O1 -g -fsanitize=address -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=address"
          make -j2
          make -C test mfamgreplay testmfamgv8maxiter
          # Libtool wrapper configures the dynamic-library lookup path.
          test -s test/mfamgreplay
      - name: Require cross-operator REJECT and same-object KEEP/TRANSPORT
        run: |
          set -euo pipefail
          bash -n test/mfamg_v8_cross_operator_smoke.sh
          export ASAN_OPTIONS="detect_leaks=0:abort_on_error=1:print_stacktrace=1"
          bash test/mfamg_v8_cross_operator_smoke.sh \
            "$PWD/build-linux/test/mfamgreplay" \
            "$PWD/build-linux/cross-operator-smoke"
      - name: Check active FGCRODR MAXITER workspace cleanup with LeakSanitizer
        run: |
          set -euo pipefail
          export ASAN_OPTIONS="detect_leaks=1:halt_on_error=1:abort_on_error=1:print_stacktrace=1"
          export LSAN_OPTIONS="exitcode=23"
          ./build-linux/test/testmfamgv8maxiter > build-linux/maxiter-lsan.log 2>&1 || {
            cat build-linux/maxiter-lsan.log
            exit 1
          }
          grep -q 'FGCRODR_ACTIVE_MAXITER_CLEANUP_OK' build-linux/maxiter-lsan.log
          cat build-linux/maxiter-lsan.log
      - name: Archive public synthetic Linux replay logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfamg-v8-linux-cross-operator-synthetic
          path: build-linux/cross-operator-smoke/*.log
          if-no-files-found: ignore
