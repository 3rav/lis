name: Experimental RAS ThreadSanitizer

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/ras-schur-scalable

permissions:
  contents: read

jobs:
  ras-tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      LIS_RAS_TSAN: '1'
      OMP_DYNAMIC: 'FALSE'
      TSAN_OPTIONS: 'halt_on_error=1:exitcode=66'
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin clang libomp-dev
      - name: Build instrumented LIS with OpenMP
        run: |
          autoreconf -fiv
          CC=clang CFLAGS="-O1 -g -fsanitize=thread -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=thread" ./configure \
            --enable-test --enable-omp --enable-half --disable-fortran --disable-f90 \
            --disable-saamg --disable-mpi
          make -j2
          make -C test testhalfilut
      - name: Exercise concurrent local RAS solves with TSan + Archer
        run: |
          set -euo pipefail
          # The distro libomp is not TSan-instrumented. Archer supplies
          # OpenMP barrier/task happens-before semantics via OMPT.
          archer="$(clang -print-file-name=libarcher.so)"
          if [ ! -f "$archer" ]; then
            archer="$(find /usr/lib/llvm-* -name libarcher.so -type f 2>/dev/null | head -1)"
          fi
          test -f "$archer" || { echo "::error::libarcher.so missing"; exit 1; }
          echo "Archer=$archer"
          export OMP_TOOL=enabled
          export OMP_TOOL_LIBRARIES="$archer"
          export ARCHER_OPTIONS=verbose=1
          export TSAN_OPTIONS="$TSAN_OPTIONS:ignore_noninstrumented_modules=1"
          ./test/testhalfilut --ras-rcm-smoke
          ./test/testhalfilut --sparse-schur-smoke
          ./test/testhalfilut --ras-half-smoke
          ./test/testhalfilut --ras-row-scale-smoke
