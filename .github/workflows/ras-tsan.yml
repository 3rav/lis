name: Experimental RAS ThreadSanitizer

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/ras-schur-scalable

permissions:
  contents: read

jobs:
  ras-tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '4'
      OMP_DYNAMIC: 'FALSE'
      TSAN_OPTIONS: 'halt_on_error=1:exitcode=66'
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Build instrumented LIS with OpenMP
        run: |
          autoreconf -fiv
          CC=gcc CFLAGS="-O1 -g -fsanitize=thread -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=thread" ./configure \
            --enable-test --enable-omp --disable-fortran --disable-f90 \
            --disable-saamg --disable-mpi
          make -j2
      - name: Exercise concurrent local RAS solves with TSan
        run: |
          ./test/testhalfilut --ras-rcm-smoke
          ./test/testhalfilut --sparse-schur-smoke
