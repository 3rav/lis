name: Temporary IRL numerical prototype validation

on:
  push:
    branches: [exp/krylov-implicit-lanczos-20261104]

jobs:
  prototype:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: gcc, cc: gcc, flags: "-O2 -Wall -Wextra"}
          - {name: clang, cc: clang, flags: "-O2 -Wall -Wextra"}
          - {name: sanitizers, cc: gcc, flags: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify implicit QR/Lanczos experiment
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          FLAGS: ${{ matrix.flags }}
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          set -euo pipefail
          "$CC" -std=c99 $FLAGS test/bench_krylov_irl_prototype.c -lm -o irl
          ./irl
