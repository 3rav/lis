name: Krylov focused review validation (temporary CI branch)
on:
  push:
    branches:
      - ci/native-krylov-review-validation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eigen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        config: [serial, openmp]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin pkg-config gfortran
      - name: Build and run four focused regressions
        run: |
          autoreconf -fiv
          mkdir build
          cd build
          if [ "${{ matrix.config }}" = "openmp" ]; then ../configure --enable-omp; else ../configure; fi
          make -j2
          make -C test test_krylov_modes test_krylov_sparse test_krylov_regression test_krylov_lis
          ./test/test_krylov_modes
          ./test/test_krylov_sparse
          ./test/test_krylov_regression
          ./test/test_krylov_lis
          make -C test check TESTS="test_krylov_modes test_krylov_sparse test_krylov_regression test_krylov_lis"
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: ASan and UBSan on all standalone numerical regressions
        run: |
          for suite in modes sparse regression; do
            cc -O1 -g -std=c99 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude src/esolver/lis_krylov.c test/test_krylov_${suite}.c -lm -o /tmp/test_krylov_${suite}
            ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 /tmp/test_krylov_${suite}
          done
