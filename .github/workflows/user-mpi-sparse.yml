name: USER row sparse halo MPI exchange
on:
  pull_request:
    paths:
      - 'src/matrix/**'
      - 'src/matvec/**'
      - 'src/vector/**'
      - 'src/precon/**'
      - 'src/solver/lis_solver.c'
      - 'src/system/lis_memory.c'
      - 'include/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - '.github/workflows/user-mpi-sparse.yml'
      - 'test/testusermpisparse.c'
  push:
    branches:
      - develop
      - 'feature/upstream-user-mpi-sparse-20261125'
    paths:
      - 'src/matrix/**'
      - 'src/matvec/**'
      - 'src/vector/**'
      - 'src/precon/**'
      - 'src/solver/lis_solver.c'
      - 'src/system/lis_memory.c'
      - 'include/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - '.github/workflows/user-mpi-sparse.yml'
      - 'test/testusermpisparse.c'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mpi-sparse:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name != 'pull_request' && '[{"mode":"release","index":"int32"},{"mode":"release","index":"int64"},{"mode":"asan-ubsan","index":"int32"},{"mode":"asan-ubsan","index":"int64"}]' || '[{"mode":"release","index":"int32"},{"mode":"asan-ubsan","index":"int64"}]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build and MPI toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin openmpi-bin libopenmpi-dev
      - name: Build and test off-rank USER row access
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          if [ "${{ matrix.mode }}" = asan-ubsan ]; then
            export CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
            export LDFLAGS="-fsanitize=address,undefined"
            export ASAN_OPTIONS="detect_leaks=0:halt_on_error=1"
          else
            export CFLAGS="-O2 -g"
            export LDFLAGS=""
          fi
          index_flags=""
          abi_flags=""
          if [ "${{ matrix.index }}" = int64 ]; then
            index_flags="--enable-longlong"
            abi_flags="-D_LONG__LONG"
          fi
          ./configure MPICC=mpicc MPIRUN=mpiexec --enable-test --enable-mpi --disable-omp --disable-fortran --disable-f90 --disable-saamg ${index_flags}
          make -C src -j2
          mpicc -DUSE_MPI -DHAVE_CONFIG_H ${abi_flags} -I. -Iinclude ${CFLAGS} test/testusermpisparse.c -Lsrc/.libs -llis -lm ${LDFLAGS} -o test/testusermpisparse
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          mpiexec -n 1 ./test/testusermpisparse
          mpiexec -n 2 ./test/testusermpisparse
          mpiexec --oversubscribe -n 3 ./test/testusermpisparse
          mpiexec --oversubscribe -n 4 ./test/testusermpisparse
