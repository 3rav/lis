name: CalculiX storage ABI to LIS_MATRIX_USER end-to-end test
on:
  pull_request:
    paths:
      - 'test/fixtures/calculix/**'
      - 'test/testccxadapter.c'
      - 'test/testccxuserpath.c'
      - '.github/workflows/calculix-user-path.yml'
      - 'src/matrix/lis_matrix_materialize.c'
      - 'src/matrix/lis_matrix.c'
      - 'src/matvec/lis_matvec.c'
      - 'src/vector/lis_vector_real64.c'
      - 'include/lis_matrix_materialize.h'
      - 'include/lis.h'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
  push:
    branches: [develop]
    paths:
      - 'test/fixtures/calculix/**'
      - 'test/testccxadapter.c'
      - 'test/testccxuserpath.c'
      - '.github/workflows/calculix-user-path.yml'
      - 'src/matrix/lis_matrix_materialize.c'
      - 'src/matrix/lis_matrix.c'
      - 'src/matvec/lis_matvec.c'
      - 'src/vector/lis_vector_real64.c'
      - 'include/lis_matrix_materialize.h'
      - 'include/lis.h'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ccx-user-path:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name != 'pull_request' && '[{"index":"int32","build":"release"},{"index":"int64","build":"release"},{"index":"int32","build":"asan-ubsan"},{"index":"int64","build":"asan-ubsan"}]' || '[{"index":"int32","build":"release"},{"index":"int64","build":"asan-ubsan"}]') }}
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - name: Checkout upstream-based LIS branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout unmodified CalculiX 2.19 source (header and storage ABI)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: 3rav/CalculiX
          ref: 84d5dd9ca1bdaf6ad6e92c5c0d50b8f1965975ba
          path: ccx-source
          persist-credentials: false
      - name: Install Autotools and compilers
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Configure, build, and run CCX storage-to-USER integration
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          ccx_flags="-DARCH=Linux"
          index_flags=""
          if [ "${{ matrix.index }}" = int64 ]; then
            ccx_flags="$ccx_flags -DLONGLONG -D_LONG__LONG"
            index_flags="--enable-longlong"
          fi
          if [ "${{ matrix.build }}" = asan-ubsan ]; then
            export CFLAGS="-std=c99 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
            export LDFLAGS="-fsanitize=address,undefined"
          else
            export CFLAGS="-std=c99 -O2 -g"
            export LDFLAGS=""
          fi
          ./configure --enable-test --enable-omp --disable-mpi --disable-fortran --disable-f90 --disable-saamg $index_flags
          # Only liblis is needed here. Avoid compiling the entire native
          # test suite four times; its own CI workflows cover those tests.
          make -C src -j2
          cc $CFLAGS -DHAVE_CONFIG_H $ccx_flags -Iinclude -Iccx-source/ccx/src \
            test/testccxuserpath.c -Lsrc/.libs -llis -lm -fopenmp $LDFLAGS \
            -o ./testccxuserpath
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          ./testccxuserpath
          cc $CFLAGS -DHAVE_CONFIG_H $ccx_flags \
            -Iinclude -Iccx-source/ccx/src -Itest/fixtures/calculix \
            test/testccxadapter.c test/fixtures/calculix/ccx_lis_user_adapter.c \
            -Lsrc/.libs -llis -lm -fopenmp $LDFLAGS \
            -o ./testccxadapter
          ./testccxadapter
