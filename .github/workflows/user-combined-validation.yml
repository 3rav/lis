name: USER combined integration validation
on:
  push:
    branches: ['integration/user-current-develop-20261125']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  combined:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [release, asan-ubsan]
        index: [int32, int64]
        distribution: [serial, mpi]
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin openmpi-bin libopenmpi-dev
      - name: Build LIS and run combined regressions
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          if [ "${{ matrix.mode }}" = asan-ubsan ]; then
            export CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
            export LDFLAGS="-fsanitize=address,undefined"
          else
            export CFLAGS="-O2 -g"
            export LDFLAGS=""
          fi
          index_flags=""
          abi_flags=""
          if [ "${{ matrix.index }}" = int64 ]; then
            index_flags="--enable-longlong"
            abi_flags="-D_LONG__LONG"
          fi
          if [ "${{ matrix.distribution }}" = mpi ]; then
            export ASAN_OPTIONS="detect_leaks=0:halt_on_error=1"
            ./configure MPICC=mpicc MPIRUN=mpiexec --enable-test --enable-mpi --disable-omp --disable-fortran --disable-f90 --disable-saamg ${index_flags}
          else
            ./configure --enable-test --enable-omp --disable-mpi --disable-fortran --disable-f90 --disable-saamg ${index_flags}
          fi
          make -C src -j2
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          if [ "${{ matrix.distribution }}" = mpi ]; then
            for t in testusermpicallback testusermpijacobi testusermpirows testusermpisparse; do
              mpicc -DUSE_MPI -DHAVE_CONFIG_H ${abi_flags} -I. -Iinclude ${CFLAGS} test/$t.c -Lsrc/.libs -llis -lm ${LDFLAGS} -o test/$t
              for ranks in 1 2; do
                timeout 120s mpiexec --oversubscribe -n "$ranks" ./test/$t
              done
            done
            for ranks in 3 4; do
              timeout 120s mpiexec --oversubscribe -n "$ranks" ./test/testusermpisparse
            done
          else
            make -C test testbicgstablinit testusertfqmrcallback testusergmreserrors testuserorthominerrors testusergpbic testusercrserrors testusercrcomplex testuserbicgstabl testuseridrcallback testuserfgcrodrerrors
            for t in testbicgstablinit testusertfqmrcallback testusergmreserrors testuserorthominerrors testusergpbic testusercrserrors testusercrcomplex testuserbicgstabl testuseridrcallback testuserfgcrodrerrors; do
              timeout 120s ./test/$t
            done
          fi
