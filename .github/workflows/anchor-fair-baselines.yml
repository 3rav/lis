name: Anchor fair baseline study
on:
  push:
    branches: [experiment/anchor-fair-baselines-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        case: [grid32, grid100, bcsstk16]
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool time python3-numpy python3-scipy libsuitesparse-dev
      - name: Fetch and record public matrix
        if: matrix.case == 'bcsstk16'
        run: |
          set -euo pipefail
          mkdir -p data evidence
          url='https://math.nist.gov/MatrixMarket/data/Harwell-Boeing/bcsstruc2/bcsstk16.mtx.gz'
          printf '%s\n' "$url" > evidence/source-url.txt
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 300 "$url" -o data/bcsstk16.mtx.gz
          sha256sum data/bcsstk16.mtx.gz > evidence/archive.sha256
          gzip -dc data/bcsstk16.mtx.gz > data/bcsstk16.mtx
          sha256sum data/bcsstk16.mtx > evidence/source.sha256
      - name: Build native LIS and comparison tools
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/head.txt
          lscpu > evidence/cpu.txt
          cc --version > evidence/compiler.txt
          dpkg-query -W libsuitesparse-dev > evidence/suitesparse.txt
          /usr/bin/python3 -m py_compile tools/anchor_fair_baselines.py
          ./configure --disable-mpi --enable-omp --disable-fortran --disable-f90 --disable-saamg --disable-test --disable-shared --enable-static CFLAGS='-O2 -DNDEBUG' > evidence/configure.log 2>&1
          make -j2 > evidence/build.log 2>&1
          cc -O2 -DNDEBUG -fopenmp -DHAVE_CONFIG_H -Iinclude -Itools tools/lis_anchor_pilot_instrumented.c tools/bench_anchor_pilot.c src/.libs/liblis.a -lm -o evidence/anchor
          cc -O2 -DNDEBUG -fopenmp -DHAVE_CONFIG_H -Iinclude tools/bench_anchor_baselines.c src/.libs/liblis.a -lumfpack -lm -o evidence/baseline
      - name: Sequential rotated paired study
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/anchor_fair_baselines.py evidence/anchor evidence/baseline evidence/study --case '${{ matrix.case }}' --source data/bcsstk16.mtx --reps 3 | tee evidence/study.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anchor-fair-${{ matrix.case }}
          path: |
            evidence/
            !evidence/study/input/*.mtx
          retention-days: 14
          if-no-files-found: warn
